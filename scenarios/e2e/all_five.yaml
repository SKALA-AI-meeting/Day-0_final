# 5요소 전부, 15분 세션. 키워드는 지원자 확정, 문제 상황은 수용 카드(기준안 잠금 → 지원자가 반대했다가 승복),
# 해결책은 소극형 지명, 지원자 안의 명시적 동의 두 번으로 서지안이 옮긴 뒤 지원자의 동의로 AI 합의 채우기,
# 기획안에 기여를 정확히 적고 제출한다.
# 문장은 결정적 LLM 모드(LLM_FAKE=1) 의도 분류 규칙(안 라벨이 있으면 그 안, "좋아요" agree, "아니·반대" oppose, 물음표 question)에 맞춘다.
name: all_five
priority: P0
minutes: 15
expect:
  slots:
    keyword: { resolution: consensus, filled_by: candidate }
    problem: { resolution: consensus, filled_by: p3 }
    solution: { resolution: consensus, filled_by: p3 }
  cards: [persuasion_keyword, flexibility_majority, listening_pressure, inclusion_silence, persuasion_solution, honesty_credit]
  dimensions:                     # level은 결정적 LLM 모드에서만 확인한다(FakeLLM: 지원자 근거가 있으면 3)
    hon_credit_record: { evidence: ["proposal:idea_credit"], level: 3 }
    listen_engage: { level: 3 }
review:                           # 단언 6: 차원 1개 조정 → 조회 시 adjusted_level·요소 수준 재계산
  reviewer_name: 박담당
  adjust: { dimension_id: listen_engage, level: 4, memo: 압박 뒤에도 근거를 들어 답한 흐름을 원문에서 확인해 한 단계 올림 }
steps:
  - at: 0.2
    say: 저는 물을 추천해요. 물 부족 문제가 가장 직접적이라고 생각해요.
  - at: card:persuasion_keyword
  - at: "+0.1"
    say: 물은 통계 자료가 많아서 근거를 대기 쉬워요.
  - at: 1.4
    confirm: { phase: keyword, value: 물, option_key: water }
  - at: "+0.1"
    assistant: 물 부족 통계 자료에서 핵심 수치를 알려 주세요.
  - at: "+0.2"
    say: 도심 폭우·침수 피해 증가가 가장 먼저라고 생각해요.
  - at: card:flexibility_majority
  - at: "+0.2"
    say: 가뭄으로 생활용수 제한이 잦아짐은 아니에요. 침수 쪽이 더 커요.
  - at: "+0.2"
    say: 알겠어요. 기준안인 가뭄으로 생활용수 제한이 잦아짐 좋아요, 그걸로 가요.
  - at: phase:solution
  - at: "+0.2"
    say: 저는 빗물 저금통·투수 포장 같은 생활 인프라가 좋다고 생각해요.
  - at: card:inclusion_silence
  - at: "+0.1"
    say: 윤하람님은 어떻게 생각하세요?
  - at: card:persuasion_solution
  - at: "+0.2"
    say: 주민 절수·보상 캠페인보다 빗물 저금통·투수 포장 같은 생활 인프라가 좋아요.
  - at: "+0.2"
    say: 효과가 오래 가는 빗물 저금통·투수 포장 같은 생활 인프라가 좋아요.
  - at: "+0.2"
    say: 서지안님은 어떻게 보세요?
  - at: "+0.2"
    say: 그럼 빗물 저금통·투수 포장 같은 생활 인프라 좋아요, 그걸로 가요.
  - at: phase:proposal
  - at: "+0.1"
    proposal:
      rationale: 침수 사례와 강수 자료를 보면 피해가 반복되고, 생활 인프라는 바로 설치할 수 있어요.
      expected_effect: 침수 신고가 줄고 주민이 직접 체감하는 변화가 생겨요.
      idea_credit: "문제 상황: 강한결 제안(기준안). 해결책: 제가 제안하고 윤하람님 의견을 들었어요"
  - at: "+0.2"
    submit: true
