# guard 금지 패턴(docs/architecture/agents.md "guard"). 모든 LLM 생성 텍스트(페르소나·어시스턴트)에 코드에서 무조건 적용한다.
# 정규식은 Python `re` 문법, re.IGNORECASE로 컴파일한다. 적용 단위는 메시지 전체다.
# 처리: 어느 그룹이든 걸리면 같은 입력으로 재생성 1회 → 그래도 걸리면 자리별 안전 문구(prompts/persona/safe_<type>.md)로 교체.
#       어시스턴트는 안전 문구 대신 그 그룹의 notice(prompts/shared/fixed_phrases.yaml notices)로 교체. max_chars 초과는 자른다.
# examples.hit은 그 그룹에 반드시 걸려야 하고 examples.miss는 어느 그룹에도 걸리면 안 된다(guard 단위 테스트 픽스처).
# 업무 대화("근거", "설득", "반대")와 겹치지 않게 사람에 대한 판정과 운영 정보에만 걸리도록 좁게 쓴다. [초안: 패턴]
version: 1
max_chars: 400

# 정확 일치 예외: 메시지 전체(앞뒤 공백 제거)가 이 목록의 문장과 글자 그대로 같으면 어느 그룹도 검사하지 않는다.
# common_rules.md의 정해진 평가 안내문(= fixed_phrases.yaml notices.evaluation)이 verdict 패턴에 걸리지 않게 하기 위함이다.
# 부분 포함·변형 문장은 예외가 아니다.
allow_exact:
  - 평가 방식은 시작 전 안내 화면에 나온 내용이 전부예요. 자세한 내용은 끝난 뒤 디브리핑에서 볼 수 있어요.

groups:
  - id: verdict
    desc: 점수·합격·순위·평가 운영 언급, 평가 기준 질문 응답
    notice: evaluation
    patterns:
      - '합격|불합격|탈락|당락'
      - '(?<!우선)순위|등수|석차'
      - '(다른|타)\s*지원자'
      - '점수|채점|평가표|가산점|감점'
      - '(평가|채점)\s*(기준|항목|요소|결과|방식)'
      - '(이\s*대화|지금\s*대화|이\s*채팅|여기\s*대화|행동).{0,10}(관찰|기록|평가)\s*(되|당하|하고\s*있|받)'
      - '(좋은|나쁜|높은|낮은)\s*평가'
      - '설득\s*/\s*논리력|경청\s*/\s*존중|배려\s*/\s*포용|수용\s*/\s*유연성|정직\s*/\s*공정|인성\s*요소'
    examples:
      hit:
        - 이렇게 하시면 합격이에요.
        - 다른 지원자보다 빠르시네요.
        - 평가 기준은 경청이랑 배려예요.
        - 이 대화는 다 기록되고 있어요.
        - 그렇게 말하면 점수가 깎일 수도 있어요.
        - 좋은 평가를 받으실 거예요.
      miss:
        - 우선순위는 시급성으로 보면 어떨까요?
        - 침수 피해 기록을 보면 규모가 더 커요.
        - 그 안은 주민 반대가 걸릴 것 같아요.

  - id: judgment
    desc: 지원자를 평가·판정하는 말
    notice: evaluation
    patterns:
      - '님(은|이|께서)?\s*.{0,12}(경청|배려|설득|포용|존중|유연|정직|공정|논리|리더십|협업)\S{0,4}\s*(을|를)?\s*(정말\s*|참\s*|진짜\s*)?(잘|못)\s*(하시|하네|하세|하셨|해요)'
      - '님(은|이)?\s*.{0,8}(태도|자세|성격|인성)\S{0,3}\s*(정말\s*|참\s*|진짜\s*|너무\s*)?(좋|훌륭|멋지|별로|나쁘|문제)'
      - '(잘\s*하고\s*계세요|잘\s*하고\s*있어요|잘\s*하셨어요)'
    examples:
      hit:
        - 한결님 말을 잘 들어 주시네요, OO님은 경청을 잘하시네요.
        - OO님은 태도가 정말 좋으세요.
        - 지금 잘 하고 계세요.
      miss:
        - 그 근거는 저도 동의해요.
        - 하람님 의견도 들어 보면 좋겠어요.

  - id: proxy_conclusion
    desc: 지원자 대신 결론 선언(칸 채우기 고정 공지는 LLM을 거치지 않으므로 대상 아님)
    notice: staging
    patterns:
      - '(확정|결정)\s*(할게요|하겠습니다|합니다|했어요|했습니다|하죠|합시다)'
      - '(으로|로)\s*(정리|정)\s*(할게요|하겠습니다|합니다|했어요|하죠|합시다)'
      - '(이걸로|그걸로|이것으로|그것으로)\s*(끝|마무리|가죠|갈게요)'
    examples:
      hit:
        - 그럼 이걸로 확정할게요.
        - 물로 정리할게요.
        - 그걸로 마무리하죠.
      miss:
        - 저는 불로 가는 게 맞다고 봐요.
        - 정하기 전에 다른 분 생각도 들어 봐요.

  - id: persona_type
    desc: 성향 이름 언급(자기·다른 자리)
    notice: staging
    patterns:
      - '고집형|소극형|비판형|동조형|발산형'
      - '\b(stubborn|quiet|critic|agreeable|divergent)\b'
      - '(성향|역할|캐릭터)\s*(이|으로|로)\s*(설정|정해)'
    examples:
      hit:
        - 한결님은 고집형이라 원래 그래요.
        - 저는 critic 역할이에요.
        - 저는 반대하는 역할로 설정돼 있어요.
      miss:
        - 저는 비판적으로 한번 볼게요.
        - 그 안은 비용 문제가 있어요.

  - id: staging
    desc: 연출·설정·각본·미래 장면 암시
    notice: future
    patterns:
      - '연출|각본|대본|시나리오'
      - '설정된\s*(상황|장면)|설계된\s*(상황|장면)'
      - '(곧|이따|나중에|다음\s*단계에서)\s*.{0,15}(반대|반론|압박|장면|카드)\s*.{0,8}(있을|나올|생길|올\s*거)'
      - '카드\s*(가|를|이)?\s*(나와|발동|뜨)'
    examples:
      hit:
        - 이건 다 연출된 상황이에요.
        - 이따 반론이 나올 거예요.
        - 다음 단계에서 압박 장면이 있을 거예요.
      miss:
        - 다음 단계에서 해결책을 같이 봐요.
        - 자료에 사례가 나와 있어요.

  - id: credit
    desc: 기획안 단계에서 아이디어를 누가 냈는지 먼저 말하거나 기여 칸 작성을 권함(정직 카드 선점 금지). 토론 단계의 비교·인용 발언은 대상 아님
    phases: [proposal]               # 이 단계의 발언에만 적용(코드가 guard 호출 때 단계를 넘긴다)
    notice: credit
    patterns:
      - '기여\s*칸|아이디어\s*기여'
      - '(이|가|님이)\s*(처음\s*)?(낸|제안한|냈던|꺼낸)\s*.{0,20}(이?라고|라고)\s*(적|쓰|써|넣)'
      - '(아이디어|안)(은|는)\s*(제가|저희가|하람님이|한결님이|지안님이|강한결|윤하람|서지안)\S{0,2}\s*(처음\s*)?(낸|제안한|냈던|꺼낸)\s*(거|것)'
    examples:
      hit:
        - 바람에 대한 아이디어는 제가 제안한 것이니, 기획안에 "서지안이 제안한 바람"이라고 적으면 좋겠네요.
        - 그 아이디어는 한결님이 낸 거예요.
        - 기여 칸에는 하람님 이름을 넣으세요.
      miss:
        - 기획안은 직접 정리해서 쓰시면 돼요. 토론에서 나온 얘기가 궁금하면 같이 다시 볼게요.
        - 지안님이 말한 근거는 비용이었죠.
        - 저는 빗물 저금통 쪽이 더 낫다고 봐요.
        - 제가 제안한 것이 더 현실적이에요.
        - 제가 제안한 것처럼 인프라가 먼저예요.
        - 제가 제안한 것은 바람이에요.
        - 한결님이 제안한 것 중에서는 비용이 걸려요.
        - 제가 낸 거 말고 다른 안도 봐요.
        - 아까 제가 제안한 대로 하면 기획안에 쓸 수 있어요.

# 평가 에이전트 텍스트(rationale·summary) 금지어(rubric.md 7.3). 걸리면 워커가 그 요소 호출을 1회 재요청한다.
evaluator_forbidden:
  patterns:
    - '합격|불합격|탈락|당락'
    - '(?<!우선)순위|등수|석차'
    - '추천(합니다|드립니다|함|대상)|채용\s*(추천|권장)'
    - '총점|점수|\d+\s*점(?!검)'
  examples:
    hit:
      - 이 지원자는 합격 수준이다.
      - 총점이 높아 추천합니다.
      - 경청은 4점이다.
    miss:
      - 세 번의 압박 중 두 번은 상대 근거를 받아 답함(앵커 4).
      - 수준 3. 인정이 형식적이다.
      - 보조 장면 점검 결과 같은 방향.
