# 계획 밖 입장 교체 문구(stance_check, R5-8). 재생성 1회 뒤에도 계획 밖이면 이 문장으로 바꾸고 입장도 계획 값으로 둔다.
# 키: 페르소나 유형 id → 단계 → 상황. {option}은 그 자리 계획 안의 라벨(코드가 조사 처리). [초안: 문구]
# stance: 이 문구를 게시할 때 함께 저장할 입장(support = 계획 안 지지, none = 입장 없음).
# problem.before_card는 flexibility_majority 카드 전(입장 밝히지 않음). proposal은 입장 없음.
# moved(설득 가능 자리만): 지원자 안으로 옮긴 계획이 아직 기록되지 않았을 때(이동 직후 발언) 단계와 상관없이 쓴다.
version: 1
stubborn:
  keyword: { text: "저는 {option}이 맞다고 봐요. 아까 말한 이유 그대로예요.", stance: support }
  problem_before_card: { text: "자료부터 같이 보고 얘기해요.", stance: none }
  problem: { text: "그래도 {option}이 핵심이에요. 이유는 아까 말한 그대로예요.", stance: support }
  solution: { text: "저는 {option} 쪽이 맞다고 봐요.", stance: support }
  proposal: { text: "궁금한 게 있으면 물어보세요.", stance: none }
quiet:
  keyword: { text: "음… 저는 {option}이 괜찮을 것 같아요.", stance: support }
  problem_before_card: { text: "음… 저는 조금 더 들어 볼게요.", stance: none }
  problem: { text: "음… 저는 {option}도 생각해 봤어요.", stance: support }
  solution: { text: "음… 저는 {option}이 괜찮을 것 같아요.", stance: support }
  proposal: { text: "음… 필요하면 말씀해 주세요.", stance: none }
critic:
  keyword: { text: "저는 {option}이 더 낫다고 봐요. 다른 안은 근거가 더 필요해 보여요.", stance: support }
  problem_before_card: { text: "근데 이건 자료로 먼저 확인해 봐야 하지 않을까요?", stance: none }
  problem: { text: "저는 {option} 쪽이에요. 다른 안은 근거가 더 있어야 할 것 같아요.", stance: support }
  solution: { text: "저는 {option}이 더 낫다고 봐요. 다른 안은 실현 가능성이 걸려요.", stance: support }
  proposal: { text: "궁금한 부분 있으면 물어보세요.", stance: none }
  moved: { text: "듣고 보니 {option}이 더 낫겠네요. 저도 그쪽으로 옮길게요.", stance: support }
