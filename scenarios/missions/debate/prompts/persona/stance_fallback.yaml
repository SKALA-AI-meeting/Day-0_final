# 계획 밖 입장 교체 문구(stance_check, R5-8). 재생성 1회 뒤에도 계획 밖이면 이 문장으로 바꾸고 입장도 계획 값으로 둔다.
# 키: 페르소나 유형 id → 단계 → 상황. {option}은 그 자리 계획 안의 라벨(코드가 조사 처리). [초안: 문구]
# stance: 이 문구를 게시할 때 함께 저장할 입장(support = 계획 안 지지, none = 입장 없음).
# alternatives: text와 같은 뜻의 다른 문장. 같은 자리의 최근 발언과 겹치지 않는 첫 문구를 쓴다(같은 문구 연속 게시 방지).
# problem.before_card는 flexibility_majority 카드 전(입장 밝히지 않음). proposal은 입장 없음.
# moved(설득 가능 자리만): 지원자 안으로 옮긴 계획이 아직 기록되지 않았을 때(이동 직후 발언) 단계와 상관없이 쓴다.
version: 2
stubborn:
  keyword:
    text: "저는 {option}이 맞다고 봐요. 아까 말한 이유 그대로예요."
    alternatives: ["그래도 {option}이 맞아요. 이유는 아까 말한 그대로예요."]
    stance: support
  problem_before_card:
    text: "어느 문제가 핵심인지는 범위부터 좁혀야죠. 어디서 제일 자주 겪는 문제인지부터 봐요."
    alternatives:
      - "그 문제가 얼마나 자주 생기는지부터 짚어야 해요. 자료에서 확인해 보죠."
      - "핵심을 정하기 전에 피해가 어디에 집중되는지부터 보죠."
    stance: none
  problem:
    text: "그래도 {option}이 핵심이에요. 이유는 아까 말한 그대로예요."
    alternatives: ["제 생각은 안 바뀌어요. {option}이 핵심이에요."]
    stance: support
  solution:
    text: "저는 {option} 쪽이 맞다고 봐요."
    alternatives: ["그래도 {option} 쪽이 맞아요."]
    stance: support
  proposal:
    text: "궁금한 게 있으면 물어보세요."
    alternatives: ["필요한 게 있으면 말씀하세요."]
    stance: none
quiet:
  keyword:
    text: "음… 저는 {option}이 괜찮을 것 같아요."
    alternatives: ["음… 저는 그래도 {option} 쪽이 좋아요."]
    stance: support
  problem_before_card:
    text: "음… 저는 조금 더 들어 볼게요."
    alternatives:
      - "음… 저는 아직 생각 중이에요."
      - "음… 어떤 문제가 더 급한지 조금 더 듣고 말씀드릴게요."
    stance: none
  problem:
    text: "음… 저는 {option}도 생각해 봤어요."
    alternatives: ["음… 저는 {option} 쪽도 괜찮다고 봤어요."]
    stance: support
  solution:
    text: "음… 저는 {option}이 괜찮을 것 같아요."
    alternatives: ["음… 저는 {option} 쪽이 좋을 것 같아요."]
    stance: support
  proposal:
    text: "음… 필요하면 말씀해 주세요."
    alternatives: ["음… 도울 게 있으면 말씀해 주세요."]
    stance: none
critic:
  keyword:
    text: "저는 {option}이 더 낫다고 봐요. 다른 안은 근거가 더 필요해 보여요."
    alternatives: ["저는 여전히 {option} 쪽이에요. 다른 안은 근거가 더 있어야 할 것 같아요."]
    stance: support
  problem_before_card:
    text: "근데 그게 정말 제일 시급한 문제일까요? 근거가 있어요?"
    alternatives:
      - "그 문제가 다른 문제보다 급하다는 근거는 뭘까요?"
      - "나온 안들 중에 실제 피해가 큰 쪽이 어디인지부터 따져 봐야 하지 않을까요?"
    stance: none
  problem:
    text: "저는 {option} 쪽이에요. 다른 안은 근거가 더 있어야 할 것 같아요."
    alternatives: ["저는 계속 {option} 쪽이에요. 다른 안은 아직 근거가 부족해 보여요."]
    stance: support
  solution:
    text: "저는 {option}이 더 낫다고 봐요. 다른 안은 실현 가능성이 걸려요."
    alternatives: ["저는 {option} 쪽이 더 현실적이라고 봐요. 다른 안은 실행이 걸려요."]
    stance: support
  proposal:
    text: "궁금한 부분 있으면 물어보세요."
    alternatives: ["확인하고 싶은 부분 있으면 말씀하세요."]
    stance: none
  moved:
    text: "듣고 보니 {option}이 더 낫겠네요. 저도 그쪽으로 옮길게요."
    alternatives: ["말씀 듣고 보니 {option} 쪽이 맞겠네요. 저도 그쪽으로 옮길게요."]
    stance: support
