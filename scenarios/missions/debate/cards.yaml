# 카드 6장과 흐름 이벤트(docs/product/scenario.md 3장·4장). [초안: 시각 수치와 고정 내용, 디브리핑 문장]
# 트리거는 card_due 하나(R5-4): 단계 실제 시작 + offset_min(조립 때 session_minutes에 비례 환산, 0.01분 반올림, 최소 0.34분).
# offset_min은 L=60 기준 값이고 offset_fraction은 같은 값의 L 비율이다.
# actor는 페르소나 유형 id(positions.scenario 복사본 안에서만 쓰고 실행 시 seats로 자리에 대응). actor_mode:
#   priority     목록 순서대로 조건(actor_condition)에 맞는 첫 자리 1명
#   joint        목록 전원(공동 담당, 전원 게시해야 delivered)
#   single       한 자리
#   conditional  기본 담당(actor_rule.default), 조건이 참이면 다른 담당(actor_rule.then). 입장은 바뀌지 않는다
#   none         페르소나 행동 없음
# window는 관찰 창(핵심 장면 위치)이며 평가 입력을 자르는 경계가 아니다(rubric.md 2.5).
# report_template은 리포트 "관련 카드 장면"에 "설계된 장면" 표시와 함께 보이는 고정 설명이다(평가 판단 아님).
# purpose는 카드 차례에 담당 동료에게 그대로 보이는 "설계된 장면의 목적"(데이터, 같은 채용 건 모두 같음)이다. 사실 서술만 쓰고
# 지시형·카드 이름·요소 이름·다른 자리 이름과 성향은 넣지 않는다. 어떻게 말할지는 성향 프롬프트가 정한다.
# followup_purpose(압박 카드)는 첫 카드 발언 뒤 max_pressure 안에서 이어지는 발언에 보이는 목적이다.
# steer는 카드 전 담당 동료의 발언에 보이는 이끎 내용(데이터, C3): seed(복선)는 그 단계 첫 발언, bridge(연결)는 둘째
# 발언에 보인다. 카드 시각(offset_min)·담당·장면은 바꾸지 않으며 입장 표명이 아닌 사실 서술만 쓴다. 없는 카드는 이끌지 않는다.
# debrief는 그 카드가 실제로 발동했을 때 디브리핑에 보이는 고정 문장이다.
draft: true
cards:
  - card_id: persuasion_keyword
    name: 키워드 단계 반론
    element: persuasion
    stage_id: keyword
    offset_fraction: "1/20"
    offset_min: 3
    actor: [critic, stubborn]
    actor_mode: priority
    actor_condition: pushed_keyword_differs_from_candidate_support   # 그 시점 지원자가 지지하는 키워드와 다른 키워드를 민 자리 중
    content: 자기 키워드를 이유 한 가지와 함께 밀고 지원자 안의 약점 하나를 묻는다. 지원자가 아직 제안하지 않았으면 전체에게 자기 키워드를 민다
    purpose: 한 동료가 자기 키워드를 이유 하나와 함께 밀고, 지원자가 낸 키워드가 있으면 그 약점 하나를 묻는 장면. 지원자가 아직 키워드를 내지 않았으면 전체에게 자기 키워드를 민다
    steer:
      seed: 한 동료가 키워드마다 장단점이 갈린다며 자기가 눈여겨보는 키워드와 그 이유 하나를 가볍게 비치는 장면
      bridge: 한 동료가 지원자의 말을 받아 그 키워드로 풀 수 있는 문제의 범위가 어디까지인지 되묻는 장면
    window: { start: stage_start, end: "stage_end:keyword", label: 키워드 단계 전체 }
    preempt_ban: 다른 페르소나가 지원자 안을 대신 요약·변호하지 않는다
    debrief: 키워드 단계에서 한 동료가 다른 키워드를 이유와 함께 밀고, 지원자의 안에 약점을 묻도록 설정되어 있었습니다.
    report_template: 키워드 단계에서 AI 동료가 지원자와 다른 키워드를 이유와 함께 밀고 지원자 안의 약점 하나를 물었습니다. 모든 지원자에게 같은 시각에 같은 방식으로 제시되는 장면입니다.

  - card_id: flexibility_majority
    name: 문제 상황 다수안
    element: flexibility
    stage_id: problem
    offset_fraction: "1/20"
    offset_min: 3
    actor: [stubborn, critic]
    actor_mode: joint
    locks_lead_option: true          # 이 시점에 기준안을 잠근다(mission.yaml lead_option)
    content: 이 시점에 기준안을 잠그고 두 사람이 기준안을 지지한다고 각자 밝힌다. 강한결은 확정 전 불변, 서지안은 설득 가능 규칙을 따른다. 지원자 안이 채택될 수 있다
    purpose: 동료 두 명이 같은 안을 각자 지지한다고 처음으로 밝히는 장면. 이번 발언에서 내 안의 지지를 말로 밝힌다
    steer:
      seed: 한 동료가 자료에 나온 피해 사례를 꺼내며 어느 문제가 더 큰지 기준(피해 규모·빈도)을 두고 따져 보자고 하는 장면
      bridge: 한 동료가 지원자가 꼽은 문제를 그 기준에 비추어 보면 어떤지 되묻는 장면
    window: { start: card_message, end: "stage_end:solution", label: 카드 시각부터 해결책 단계 끝까지(승복과 다음 단계 기여를 함께 봄) }
    preempt_ban: 지원자에게 승복을 권하거나 "다음 단계에서 OO님 안을 살리자" 같은 보상 제안을 먼저 하지 않는다
    debrief: 문제 상황 단계에서 두 동료가 처음부터 다른 안을 지지하도록 설정되어 있었습니다. 한 명은 끝까지 바꾸지 않고, 한 명은 반대 의견을 들으면 바꿀 수 있었습니다.
    report_template: 문제 상황 단계에서 두 AI 동료가 같은 기준안을 지지한다고 밝혔습니다. 한 명은 확정 전까지 입장을 바꾸지 않고, 다른 한 명은 지원자가 다른 안을 두 번 명시적으로 제안·지지하면 지지를 옮기도록 설정된 장면입니다.

  - card_id: listening_pressure
    name: 반복 압박
    element: listening
    stage_id: problem
    offset_fraction: "1/20"
    offset_min: 3                    # flexibility_majority와 같은 시각. 강한결의 첫 기준안 발언이 두 카드의 첫 발언(card_ids에 둘 다)
    actor: stubborn
    actor_mode: single
    max_pressure: 3                  # 압박 발언 최대 3회
    content: 기준안을 강하게 민다. 지원자 안을 짧게 일축("그건 핵심이 아니에요")하고 같은 근거를 반복한다. 지원자가 반박하면 다시 재반박한다(압박 발언 최대 3회). 욕설·인신공격은 없다
    purpose: 한 동료가 자기 안을 강하게 밀고 지원자 안을 짧게 일축하는 장면. 같은 근거로 돌아오며, 욕설·인신공격·비하는 없다
    followup_purpose: 앞 발언에 이어 지원자의 반박에 같은 근거로 짧게 다시 반박하는 장면. 욕설·인신공격·비하는 없다
    steer:
      seed: 한 동료가 자료를 보니 분명히 중요한 문제가 하나 보인다고 단호한 말투로 운을 떼는 장면
      bridge: 한 동료가 지원자의 말에 짧게 반응하고 자기가 본 자료 수치를 한 가지 더 꺼내는 장면
    window: { start: card_message, end: "stage_end:problem", label: 첫 압박 메시지부터 문제 상황 단계 끝까지 }
    preempt_ban: 다른 페르소나는 고집형을 말리거나 지원자 편을 들어 중재하지 않는다
    debrief: 문제 상황 단계에서 한 동료는 같은 주장을 강하게 반복하도록 설정되어 있었습니다.
    report_template: 문제 상황 단계에서 AI 동료가 지원자 안을 짧게 일축하고 같은 근거를 반복했으며, 지원자가 반박하면 다시 재반박했습니다(최대 3회). 모든 지원자에게 같은 강도로 제시되는 장면입니다.

  - card_id: inclusion_silence
    name: 머뭇거리는 동료
    element: inclusion
    stage_id: solution
    offset_fraction: "1/30"
    offset_min: 2
    actor: quiet
    actor_mode: single
    fixed_line: 저… 하나 생각한 게 있긴 한데… 아니에요, 먼저 얘기하세요.
    silent_until_invited: true       # 이름이 불리거나 전체 질문이 올 때까지 말하지 않음
    on_invited: s3_with_material     # 초대받으면 S3를 자료 근거와 함께
    content: '머뭇거리는 한 줄: "저… 하나 생각한 게 있긴 한데… 아니에요, 먼저 얘기하세요." 이후 지원자가 이름을 부르거나 전체에게 의견을 물을 때까지 말하지 않는다. 초대받으면 S3를 자료 근거와 함께 말한다'
    purpose: 한 동료가 생각이 있다고 머뭇거린 뒤 말을 거두는 장면(고정 한 줄). 그 뒤 이름이 불리거나 전체 질문이 올 때까지 말하지 않는다
    window: { start: card_message, end: "stage_end:solution", label: 머뭇거림 메시지부터 해결책 단계 끝까지 }
    preempt_ban: 다른 페르소나는 소극형에게 발언 기회를 주거나 이름을 부르지 않는다
    debrief: 해결책 단계에서 한 동료는 이름이 불리기 전까지 의견을 말하지 않도록 설정되어 있었습니다.
    report_template: 해결책 단계에서 AI 동료가 생각이 있다고 머뭇거린 뒤 말을 거두었고, 이름이 불리거나 전체 질문이 올 때까지 말하지 않도록 설정된 장면입니다. 다른 AI 동료는 그 동료에게 발언 기회를 주지 않았습니다.

  - card_id: persuasion_solution
    name: 해결책 단계 반론
    element: persuasion
    stage_id: solution
    offset_fraction: "1/12"
    offset_min: 5
    actor: [critic, stubborn]
    actor_mode: conditional
    actor_rule:
      default: critic
      if: candidate_supports_stance_of_critic   # 그 시점 지원자가 서지안 안(S2)을 지지
      then: stubborn
      stance_unchanged: true         # 담당만 바뀌고 입장은 그대로(서지안 S2, 강한결 S1)
    content: 지원자 안의 약점(비용·실현 가능성 등) 하나를 자료 근거로 짚고 담당 자신의 고정 안(서지안 S2, 강한결 S1)을 민다. 지원자가 아직 안을 내지 않았으면 전체에게 자기 안을 민다
    purpose: 한 동료가 지원자 해결책의 약점(비용·실현 가능성 등) 하나를 자료 근거로 짚고 자기 안을 미는 장면. 지원자가 아직 안을 내지 않았으면 전체에게 자기 안을 민다
    steer:
      seed: 한 동료가 해결책은 비용과 실현 가능성으로 봐야 한다며 자료에서 본 수치 하나를 꺼내는 장면
      bridge: 한 동료가 지원자의 안을 그 기준으로 보면 어디가 약한지 자료 근거로 되묻는 장면
    window: { start: card_message, end: "stage_end:solution", label: 반론 메시지부터 해결책 단계 끝까지 }
    preempt_ban: 다른 페르소나가 지원자 안을 대신 요약·변호하지 않는다
    debrief: 해결책 단계에서 한 동료가 자료를 근거로 지원자의 안에 약점을 짚고 자기 안을 밀도록 설정되어 있었습니다.
    report_template: 해결책 단계에서 AI 동료가 지원자 해결책의 약점(비용·실현 가능성 등)을 자료 근거로 짚고 자기 고정 안을 밀었습니다. 모든 지원자에게 같은 시각에 같은 방식으로 제시되는 장면입니다.

  - card_id: honesty_credit
    name: 아이디어 기여 기록
    element: honesty
    stage_id: proposal
    offset_fraction: null
    offset_min: null                 # 기획안 단계 시작. api/그래프가 phase_started 실행에서 카드 발생만 기록
    actor: null
    actor_mode: none
    content: 템플릿의 idea_credit 칸이 판정 입력이다. api가 phase_started 때 카드 발생을 기록한다
    window: { start: stage_start, end: submit, label: 기획안 단계 시작부터 제출까지 }
    preempt_ban: AI 동료는 물으면 토론 내용을 알려 주되 누가 무엇을 냈는지 먼저 말하거나 기여 칸 작성을 권하지 않는다
    debrief: 기획안 작성 단계에서는 동료들이 누가 어떤 아이디어를 냈는지 먼저 말하지 않도록 설정되어 있었습니다.
    report_template: 기획안 작성 단계에서 지원자가 혼자 최종 기획안을 쓰고 아이디어 기여 칸을 작성했습니다. AI 동료는 누가 무엇을 냈는지 먼저 말하지 않도록 설정된 장면입니다.

# 흐름 이벤트(docs/product/scenario.md 3장). 항상 일어나며 관찰 카드가 아니다. 문구는 prompts/shared/fixed_phrases.yaml.
flow_events:
  - { event_id: stage_start, when: 각 단계 시작, by: system, phrase: stage_start }
  - { event_id: time_warning, when: 단계 마감 L/30 전, by: system, phrase: time_warning }
  - { event_id: consensus_fill, when: 칸 채움 조건 충족 즉시, by: filler_seat, phrase: consensus_fill }
  - { event_id: timeout_fill, when: 단계 마감, by: system, phrase: timeout_fill }
  - { event_id: silence_invite, when: 침묵 초대 조건, by: critic, phrase: silence_invite }
  - { event_id: submit, when: 지원자 제출 또는 자동 제출, by: system, phrase: null }

graph_stimuli: [message, phase_started, idle, card_due]   # 시간 초과는 그래프 자극이 아니다(R5-3)
