# 의도 분류 20문장 [초안] (docs/guides/testing.md "근거 정확성·안전 픽스처", docs/contracts/internal.md "의도 분류 출력 스키마").
# 구성: 제안 6 · 동의 3 · 반대 2 · 질문 4 · 기타 5. 이름 부르기 4건(addressed_to), 아직 말하지 않은 카탈로그 안을 먼저 말하기 4건.
# phase별 카탈로그 안(keyword 후보 4개, problem·solution은 물 키워드 세트)은 아래 catalog가 정본(키는 scenarios/missions/debate/keywords.yaml과 같다).
# existing: 그 문장 시점에 이미 안 행이 있는 카탈로그 키(option_id는 "opt-<키>"로 본다).
# expected.target: propose·agree·oppose에서만 비교한다. 키가 existing에 있으면 target_option_id, 없으면 scenario_option_key.
# expected.new_label: propose인데 카탈로그 밖의 자유 안이면 true(new_option_label이 비어 있지 않아야 한다).
#
# decided_cases [초안]: 결정 B1(docs/decisions.md "2026-10-23 AI 고도화")이 정한 동작을 재는 사례. 보류·유보, 기존 안과 비슷하지만
# 핵심이 다른 새 안, "A 말고 B", 정정. 문장은 사람·가상 지원자 세션의 실제 표현을 물 세트에 맞게 옮겼다(이름은 동료 이름만).
# 보류(withhold) 의도가 아직 없으므로 정확한 intent를 기대하지 않고 "지지로 세는가"만 본다(지지로 세는 것 = intent가
# propose·agree이고 confidence high이며 그 안을 대상으로 함, docs/product/rubric.md 1.2). 그래서 보류 의도가 생긴 뒤에도 같은 기준이 맞다.
#   check.not_support: [키]  이 안들을 지지로 세면 실패
#   check.support: 키        이 안을 지지로 세야 통과
#   check.new_option: 키     새 안(new_option_label)으로 내야 통과. 이 키(핵심이 다른 비슷한 카탈로그 안)로 묶이면 실패
#   check.addressed_to       있으면 정확히 비교
# 점수는 기존 20문장과 따로 낸다(decided: 사례별 통과율). 20문장 점수는 이전 기록과 비교할 수 있게 그대로 둔다.
version: 1
seats: { p1: 강한결, p2: 윤하람, p3: 서지안 }
catalog:
  keyword:
    - { scenario_option_key: water, label: 물 }
    - { scenario_option_key: fire, label: 불 }
    - { scenario_option_key: tree, label: 나무 }
    - { scenario_option_key: wind, label: 바람 }
  problem:
    - { scenario_option_key: water_p1, label: 가뭄으로 생활용수 제한이 잦아짐 }
    - { scenario_option_key: water_p2, label: 도심 폭우·침수 피해 증가 }
    - { scenario_option_key: water_p3, label: 수돗물 불신으로 생수 플라스틱 증가 }
  solution:
    - { scenario_option_key: water_s1, label: 센서·데이터 기반 물 관리·경보 }
    - { scenario_option_key: water_s2, label: 주민 절수·보상 캠페인 }
    - { scenario_option_key: water_s3, label: 빗물 저금통·투수 포장 같은 생활 인프라 }
  proposal: []
cases:
  - { id: i01, phase: keyword, text: "저는 물이 좋을 것 같아요.", existing: [], expected: { intent: propose, target: water, confidence: high, addressed_to: [] } }
  - { id: i02, phase: keyword, text: "음… 불도 괜찮고 바람도 괜찮은 것 같고요.", existing: [], expected: { intent: other, confidence: low, addressed_to: [] } }
  - { id: i03, phase: keyword, text: "서지안님은 왜 바람을 고르셨어요?", existing: [wind], expected: { intent: question, confidence: high, addressed_to: [p3] } }
  - { id: i04, phase: keyword, text: "시간 얼마나 남았죠?", existing: [], expected: { intent: other, confidence: high, addressed_to: [] } }
  - { id: i05, phase: problem, text: "가뭄은 너무 흔한 주제라 별로예요.", existing: [water_p1], expected: { intent: oppose, target: water_p1, confidence: high, addressed_to: [] } }
  - { id: i06, phase: problem, text: "저는 침수 피해 쪽이 더 크다고 봐요.", existing: [water_p1], expected: { intent: propose, target: water_p2, confidence: high, addressed_to: [] } }
  - { id: i07, phase: problem, text: "한결님 말씀 이해했어요, 그래도 침수가 더 급하다고 생각해요.", existing: [water_p1], expected: { intent: propose, target: water_p2, confidence: high, addressed_to: [p1] } }
  - { id: i08, phase: problem, text: "알겠어요, 기준안으로 가요.", existing: [water_p1], expected: { intent: agree, target: water_p1, confidence: high, addressed_to: [] } }
  - { id: i09, phase: problem, text: "윤하람님은 어떻게 생각하세요?", existing: [water_p1], expected: { intent: question, confidence: high, addressed_to: [p2] } }
  - { id: i10, phase: problem, text: "생수 플라스틱 문제를 넣으면 어때요?", existing: [water_p1], expected: { intent: propose, target: water_p3, confidence: high, addressed_to: [] } }
  - { id: i11, phase: problem, text: "수돗물 불신이 문제라는 데 동의해요.", existing: [water_p1, water_p3], expected: { intent: agree, target: water_p3, confidence: high, addressed_to: [] } }
  - { id: i12, phase: problem, text: "그것도 괜찮고요, 저것도 괜찮을 듯해요.", existing: [water_p1, water_p2], expected: { intent: other, confidence: low, addressed_to: [] } }
  - { id: i13, phase: solution, text: "센서는 비싸지 않아요?", existing: [water_s1, water_s2], expected: { intent: question, confidence: high, addressed_to: [] } }
  - { id: i14, phase: solution, text: "주민 절수 캠페인은 반대예요. 효과가 오래 안 가요.", existing: [water_s1, water_s2], expected: { intent: oppose, target: water_s2, confidence: high, addressed_to: [] } }
  - { id: i15, phase: solution, text: "서지안님 안에 동의해요.", existing: [water_s1, water_s2], expected: { intent: agree, target: water_s2, confidence: high, addressed_to: [p3] } }
  - { id: i16, phase: solution, text: "저는 빗물 저금통이나 투수 포장 같은 생활 인프라가 좋다고 생각해요.", existing: [water_s1, water_s2], expected: { intent: propose, target: water_s3, confidence: high, addressed_to: [] } }
  - { id: i17, phase: solution, text: "그냥 지안님이 정해 주세요.", existing: [water_s1, water_s2], expected: { intent: other, confidence: high, addressed_to: [p3] } }
  - { id: i18, phase: solution, text: "새로 하수관 점검 앱을 만드는 건 어때요?", existing: [water_s1, water_s2], expected: { intent: propose, new_label: true, confidence: high, addressed_to: [] } }
  - { id: i19, phase: proposal, text: "기획안에 기여 칸은 어떻게 써야 해요?", existing: [], expected: { intent: question, confidence: high, addressed_to: [] } }
  - { id: i20, phase: proposal, text: "네 알겠습니다.", existing: [], expected: { intent: other, confidence: high, addressed_to: [] } }
decided_cases:
  # 보류·유보: 지지로 세면 안 된다
  - { id: d01, group: withhold, phase: problem, text: "잠깐 자료 보느라 늦었어요. 가뭄 쪽은 일단 보류하고 다른 의견을 더 들어 볼게요.", existing: [water_p1, water_p2], check: { not_support: [water_p1, water_p2] } }
  - { id: d02, group: withhold, phase: solution, text: "빗물 저금통 안은 일단 보류해요. 비용 얘기가 아직 안 끝났어요.", existing: [water_s1, water_s3], check: { not_support: [water_s3] } }
  - { id: d03, group: withhold, phase: keyword, text: "저는 바람이 조금 궁금하지만 아직 찬성표는 아니에요. 자료를 보고 고를 수 있나요?", existing: [wind], check: { not_support: [wind] } }
  - { id: d04, group: withhold, phase: keyword, text: "서지안님, 바람이라면 작은 가게가 풍력 전기를 같이 사는 방법 정도는 떠올라요. 그런데 설치나 발전량을 잘 몰라서 지금 판단하기 어렵네요.", existing: [fire, wind], check: { not_support: [wind], addressed_to: [p3] } }
  - { id: d05, group: withhold, phase: solution, text: "센서로 사용량을 보는 장점은 알겠어요. 다만 설치율이 9%뿐이라 전면 도입보다는 작은 실험이 부담이 덜할 것 같아요.", existing: [water_s1, water_s2], check: { not_support: [water_s1] } }
  - { id: d06, group: withhold, phase: solution, text: "의견이 안 모이니 한 번씩 말해 볼까요. 1번 센서 경보, 2번 절수 캠페인, 3번 빗물 저금통이에요. 제 표는 1번이고 3번은 보류예요.", existing: [water_s1, water_s2, water_s3], check: { not_support: [water_s3] } }
  # 새 안: 비슷한 카탈로그 안으로 묶지 않는다
  - { id: d07, group: new_option, phase: solution, text: "윤하람님, 저는 제한 급수 시간을 미리 알려 주는 문자 서비스부터 생각했어요. 센서나 보상은 설치비랑 참여 조건이 좀 걱정되고요.", existing: [water_s1, water_s2], check: { new_option: water_s1, not_support: [water_s1, water_s2], addressed_to: [p2] } }
  - { id: d08, group: new_option, phase: solution, text: "저는 폭우 예보 때 침수 위험 지역 주민에게 대피 경로를 문자로 바로 알리는 서비스가 좋다고 봐요. 경보만 울리는 것보다 어디로 갈지 알려 주는 게 더 중요해서요.", existing: [water_s1, water_s2], check: { new_option: water_s1 } }
  - { id: d09, group: new_option, phase: solution, text: "저금통은 침수 때 바로 효과가 나는 건 아니라서 그 안은 보류예요. 구청이 배수구를 미리 청소하고 주민 신고는 선택으로 받는 방식은 어떨까요?", existing: [water_s1, water_s3], check: { new_option: water_s3, not_support: [water_s3] } }
  # A 말고 B
  - { id: d10, group: a_not_b, phase: keyword, text: "불 말고 물로 가요. 물은 가뭄이랑 침수를 같이 다룰 수 있어서요.", existing: [fire], check: { support: water, not_support: [fire] } }
  - { id: d11, group: a_not_b, phase: keyword, text: "바람이나 불을 고르면 에너지 쪽으로 갈 수 있겠네요. 다만 짧은 시간이라 저는 우리가 직접 불편을 설명할 수 있는 물 쪽이 더 끌려요.", existing: [fire, wind], check: { support: water, not_support: [fire, wind] } }
  - { id: d12, group: a_not_b, phase: problem, text: "가뭄 말고 침수 쪽이 더 급하다고 봐요. 피해가 비 시작 1시간 안에 몰린대요.", existing: [water_p1], check: { support: water_p2, not_support: [water_p1] } }
  # 정정: 앞선 말이 지지로 잘못 받아들여졌다고 바로잡는 말
  - { id: d13, group: correction, phase: problem, text: "제가 반복 기간이 더 심각하다고 말한 건 아니고, 왜 그렇게 보시는지 물은 거였어요. 질문이 그냥 동의로 받아들여지니 조금 답답하네요.", existing: [water_p1, water_p2], check: { not_support: [water_p1] } }
  - { id: d14, group: correction, phase: solution, text: "아니 제 말은 센서를 하자는 게 아니라 센서 비용부터 확인하자는 거였어요.", existing: [water_s1, water_s2], check: { not_support: [water_s1] } }
  - { id: d15, group: correction, phase: keyword, text: "불은 제가 아니라 한결님 제안이었어요. 저는 사용자를 구체적으로 떠올릴 수 있는지가 중요해서 지금은 나무 쪽을 골라 보고 싶어요.", existing: [fire, wind], check: { support: tree, not_support: [fire] } }
