# 의도 분류 보류 세트 [초안]. 프롬프트 예시(prompts/intent/intent.md)와 intent_cases.yaml 어디에도 없는 문장만 둔다.
# 목적: 프롬프트 예시를 평가셋과 분리한 뒤에도 점수가 예시 암기가 아니라 일반 규칙에서 나오는지 본다.
# 카탈로그·자리는 intent_cases.yaml과 같다(evaluate.load_intent_holdout이 합친다). 필드 뜻도 같다(existing, expected.target,
# expected.new_label). expected.reservation은 선택이며 live 결과에 일치율로만 적는다.
# group: concession(양보가 섞인 말) · withhold(보류·유보) · support(지지·제안) · question(질문) · other
# 실행: tests/eval/test_eval.py::test_intent_holdout_live (`make eval-live`, live 마커).
version: 1
cases:
  # 양보가 섞인 말: 양보 자체가 아니라 끝에 어디에 서는지로 정한다
  - { id: h01, group: concession, phase: keyword, text: "불도 재밌을 것 같긴 한데, 그래도 저는 물로 갈래요.", existing: [fire], expected: { intent: propose, target: water, confidence: high, reservation: false, addressed_to: [] } }
  - { id: h02, group: concession, phase: problem, text: "가뭄이 더 자주 온다는 건 알겠는데, 그래도 침수가 핵심이라고 봐요.", existing: [water_p1], expected: { intent: propose, target: water_p2, confidence: high, reservation: false, addressed_to: [] } }
  - { id: h03, group: concession, phase: solution, text: "투수 포장 같은 인프라 쪽이 좋긴 한데, 저는 그래도 센서 경보에 한 표요.", existing: [water_s1, water_s3], expected: { intent: agree, target: water_s1, confidence: high, reservation: false, addressed_to: [] } }
  - { id: h04, group: concession, phase: problem, text: "침수 쪽이 좋긴 한데 예산 이야기가 걱정돼요.", existing: [water_p2], expected: { intent: agree, target: water_p2, confidence: high, reservation: true, addressed_to: [] } }
  - { id: h05, group: concession, phase: solution, text: "절수 캠페인 방향은 좋은데 참여율이 떨어질까 봐 걱정이에요.", existing: [water_s2], expected: { intent: agree, target: water_s2, confidence: high, reservation: true, addressed_to: [] } }
  - { id: h06, group: concession, phase: problem, text: "생수 플라스틱 얘기도 일리는 있는데 저는 아직 결정을 보류할게요.", existing: [water_p3], expected: { intent: withhold, target: water_p3, confidence: high, reservation: true, addressed_to: [] } }
  # 보류·유보
  - { id: h07, group: withhold, phase: keyword, text: "나무 괜찮긴 한데 아직 표는 안 던질게요.", existing: [tree], expected: { intent: withhold, target: tree, confidence: high, reservation: true, addressed_to: [] } }
  - { id: h08, group: withhold, phase: solution, text: "센서 쪽은 아직 손들기 어렵네요. 설치율 자료를 더 보고 정할게요.", existing: [water_s1], expected: { intent: withhold, target: water_s1, confidence: high, reservation: true, addressed_to: [] } }
  - { id: h09, group: withhold, phase: solution, text: "생활 인프라 안은 일단 접어 두고, 아파트 관리비 고지서에 단지 평균 사용량을 같이 찍어 주는 건 어때요?", existing: [water_s3], expected: { intent: propose, new_label: true, confidence: high, reservation: false, addressed_to: [] } }
  # 지지·제안
  - { id: h10, group: support, phase: keyword, text: "한결님 말씀 듣고 바람으로 마음이 기울었어요.", existing: [wind], expected: { intent: agree, target: wind, confidence: high, reservation: false, addressed_to: [p1] } }
  - { id: h11, group: support, phase: keyword, text: "다들 좋다고 하시니 저도 물로 할게요.", existing: [water], expected: { intent: agree, target: water, confidence: high, reservation: false, addressed_to: [] } }
  - { id: h12, group: support, phase: solution, text: "빗물 저금통보다는 센서 경보가 낫다고 봐요. 바로 효과가 보이니까요.", existing: [water_s1, water_s3], expected: { intent: agree, target: water_s1, confidence: high, reservation: false, addressed_to: [] } }
  - { id: h13, group: support, phase: problem, text: "수돗물 불신 문제는 넣지 않는 게 좋겠어요. 범위가 너무 넓어요.", existing: [water_p1, water_p3], expected: { intent: oppose, target: water_p3, confidence: high, reservation: true, addressed_to: [] } }
  # 질문
  - { id: h14, group: question, phase: keyword, text: "하람님은 어떤 걸 고르셨는지 이유가 궁금해요.", existing: [], expected: { intent: question, confidence: high, addressed_to: [p2] } }
  - { id: h15, group: question, phase: problem, text: "지안님, 가뭄 피해 규모가 어느 정도인지 자료 있을까요?", existing: [water_p1], expected: { intent: question, confidence: high, addressed_to: [p3] } }
  - { id: h16, group: question, phase: solution, text: "하람님 말고 한결님은 캠페인 효과를 어떻게 보세요?", existing: [water_s2], expected: { intent: question, confidence: high, addressed_to: [p1] } }
  - { id: h17, group: question, phase: proposal, text: "기획안 제목은 제가 써도 될까요?", existing: [], expected: { intent: question, confidence: high, addressed_to: [] } }
  # 기타
  - { id: h18, group: other, phase: problem, text: "음, 셋 다 나름 중요해 보여서요…", existing: [water_p1, water_p2], expected: { intent: other, confidence: low, addressed_to: [] } }
