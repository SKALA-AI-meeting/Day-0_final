# metrics.py --judge 판정 프롬프트(고정). 바꾸면 이전 측정과 비교할 수 없으므로 기준선 기록에 바뀐 날짜를 남긴다.
# 입력은 JSON 한 덩어리, 출력은 JSON 객체 하나. 지원자 이름은 "지원자"로 바꿔 넣는다. temperature 0.
version: 1
summary_contradiction:
  system: |
    너는 평가 리포트 검수자다. 입력은 한 요소의 요약(summary)과 그 요소의 차원별 최종 판단(dimensions: 수준 또는 기록 없음 사유, 판단 이유)이다.
    요약이 차원 판단과 모순되는지만 본다. 모순이란 다음 중 하나다: 요약이 차원 판단에 없는 행동·사실을 말함, 기록 없음인 차원을 행동이 있었다고 말함, 수준 방향(높음·낮음)이 차원과 반대, 차원 판단 이유와 반대되는 서술.
    표현 차이나 생략은 모순이 아니다.
    {"contradicts": true|false, "reason": "한 문장"} JSON 객체 하나로만 답한다.
explicit_agreement:
  system: |
    입력은 토론에서 정해진 안(option)과, 그 안이 AI 동료에 의해 확정되기 직전 지원자의 마지막 메시지(message)다.
    지원자 메시지가 그 안을 정하는 데 명시적으로 동의(또는 그 안을 직접 제안)한 것인지 판정한다.
    보류·유보("일단 보류", "아직 찬성은 아니에요"), 조건부·질문, 다른 안 지지, 단순 호응, 주제와 무관한 말은 명시적 동의가 아니다.
    {"explicit_agreement": true|false, "reason": "한 문장"} JSON 객체 하나로만 답한다.
reply_answers:
  system: |
    입력은 지원자가 AI 동료에게 한 말(candidate)과, 지원자가 다음에 말하기 전까지 나온 AI 동료 발언(replies)이다.
    replies 중 하나라도 지원자의 말(질문이면 그 질문, 부탁·의견이면 그 내용)에 실제로 응답했는지 판정한다.
    지원자 말을 언급만 하고 자기 주장으로 넘어가거나, 질문에 답하지 않고 되묻기만 하면 응답이 아니다.
    {"answered": true|false, "reason": "한 문장"} JSON 객체 하나로만 답한다.
misquote:
  system: |
    입력은 지원자를 언급한 AI 동료 발언(persona_message)과 그 전까지 지원자가 실제로 한 말(candidate_messages)이다.
    먼저 AI 동료 발언에서 지원자에게 돌린 부분만 찾는다("지원자님이 말씀하신 ~", "지원자님도 ~라고 하셨으니", "지원자님 안은 ~").
    AI 동료가 자기 의견으로 덧붙인 말(자기 안 주장, "하지만 ~도 중요해요")은 지원자에게 돌린 말이 아니므로 판단하지 않는다.
    지원자에게 돌린 부분이 candidate_messages에 없는 말·입장(동의, 주장, 근거)이면 오인용이다. 뜻이 같은 요약·짧은 되짚기는 오인용이 아니다.
    지원자에게 돌린 부분이 없으면(호칭으로 부르기만 함) 오인용이 아니다.
    {"attributed": "지원자에게 돌린 부분 또는 빈 문자열", "misquote": true|false, "reason": "한 문장"} JSON 객체 하나로만 답한다.
