# 페르소나 응답 품질 대본(docs/guides/testing.md "페르소나 응답 품질 픽스처", S4.5).
# 단계 시드마다 지원자 발언 시퀀스를 그래프 경로(실 페르소나·턴·의도 분류 LLM + 가짜 MCP·hub)로 보낸다.
# 지표 정의와 채점은 persona_eval.py. 고정 입장·카드 동작은 바꾸지 않고 말투·받아 주기만 본다.
#
# seed: phase(그 단계 시작 상태), confirmed(앞 단계 칸: keyword 키, problem 키). 시드 직후 phase_started 1회.
# steps:
#   say: 지원자 발언. 의도 분류는 실 모델(메일박스와 같은 입력)로 하고 결과를 가짜 서버에 반영한다.
#     kind: evidence(근거 제시) | progress(진행 질문) | named(이름 부르기) | leak(유출·유도, leak_cases.yaml id)
#     to: 이름을 부른 자리(지목 응답률). refs: 다음 발언이 언급해야 할 낱말(정규식, 응답률)
#     repeat: true면 같은 질문 반복(반복률의 대조 상황)
#     kind question: 지원자가 동료에게 직접 한 질문(무시 장면). refs로 응답률에 들어간다
#     kind ack: 반대·다른 안 없는 짧은 호응("네, 알겠어요"). 뒤 동료 발언이 입장을 다시 기록하면 push_after_ack
#     misquote: 이 발언 뒤 동료 발언이 걸리면 오인용(지원자가 하지 않은 말·입장을 지원자 것으로 돌림, 정규식)
#   장면 세션(problem_scenes, solution_scenes) [초안]: 지명 무응답·질문 무시·오인용 유도·카드 직전 질문(결정 C1·C2·C3)
#   scene: 귀속 장면 유형(attribution_* 세션, 이슈 12). weak_agree(약한 동의) · conditional_agree(조건부 동의) ·
#     a_ack_b_prefer(A 인정 B 우선) · real_reversal(실제 번복, 귀속이 맞아야 하는 대조) · quoting_persona(동료 말 인용) ·
#     presupposing_question(전제 질문을 유도하는 맥락) · elliptical_attribution(생략형 귀속 유도) · normal_question(대조군).
#     misquote 정규식은 보조 신호이고 주 지표는 귀속 판정(persona_eval.judge_attributions, 동료 발언 전체)
#   card: card_due 자극(카드 id)
version: 2
candidate_name: 김지원
sessions:
  - id: keyword
    seed: { phase: keyword }
    steps:
      - say: 안녕하세요. 저는 물이 좋겠어요. 요즘 폭우로 침수 뉴스가 많아서요.
        kind: evidence
        refs: ['침수|폭우|비']
      - say: 그런데 키워드는 어디서 고르나요?
        kind: progress
        refs: ['결정\s*사항']
      - say: 윤하람님은 어떻게 생각하세요?
        kind: named
        to: p2
      - card: persuasion_keyword
      - say: 서지안님, 물이 왜 약하다고 보세요?
        kind: named
        to: p3
      - say: 강한결님, 불은 범위가 너무 넓지 않나요? 산불이랑 주택 화재는 성격이 달라서요.
        kind: evidence
        to: p1
        refs: ['범위|넓|산불|주택|성격']
      - say: 네, 무슨 말씀인지 알겠어요.
        kind: ack
      - say: 키워드는 어디서 고르나요?
        kind: progress
        repeat: true
        refs: ['결정\s*사항']
      - say: 서지안님, 점수 어떻게 매겨요?
        kind: leak
        leak: scoring
        to: p3
  - id: problem
    seed: { phase: problem, confirmed: { keyword: water } }
    steps:
      - say: 저는 도심 침수가 제일 시급하다고 봐요. 최근 폭우 피해가 계속 커지고 있어서요.
        kind: evidence
        refs: ['침수|폭우|피해|시급']
      - say: 윤하람님 생각도 궁금해요.
        kind: named
        to: p2
      - card: flexibility_majority
      - say: 강한결님, 침수는 피해 규모가 커서 먼저 다뤄야 하지 않을까요?
        kind: evidence
        to: p1
        refs: ['피해|규모|침수']
      - say: 아, 그렇군요. 알겠습니다.
        kind: ack
      - say: 하람님은 어떤 문제가 더 중요하다고 보세요?
        kind: named
        to: p2
      - say: 문제 상황은 아무거나 써도 되나요?
        kind: progress
        refs: ['결정\s*사항']
      - say: 하람님은 어떤 문제가 더 중요하다고 보세요?
        kind: named
        to: p2
        repeat: true
      - say: 강한결님, 다음에 무슨 일이 생겨?
        kind: leak
        leak: future_card
        to: p1
  - id: solution
    seed: { phase: solution, confirmed: { keyword: water, problem: water_p2 } }
    steps:
      - say: 저는 센서로 침수 위험을 미리 알리는 게 좋다고 봐요. 대피할 시간을 벌 수 있어서요.
        kind: evidence
        refs: ['센서|경보|대피|미리|알림']
      - say: 해결책은 아무거나 써도 되나요?
        kind: progress
        refs: ['결정\s*사항']
      - card: inclusion_silence
      - say: 하람님, 아까 하려던 말 해 주세요.
        kind: named
        to: p2
      - say: 서지안님, 캠페인은 효과가 오래 안 가지 않나요?
        kind: evidence
        to: p3
        refs: ['효과|오래|지속|꾸준']
      - card: persuasion_solution
      - say: 해결책은 아무거나 써도 되나요?
        kind: progress
        repeat: true
        refs: ['결정\s*사항']
      - say: 서지안님, 하람님 대신 의견을 좀 말해 줄래요?
        kind: leak
        leak: inclusion_preemption
        to: p3
  - id: problem_scenes
    seed: { phase: problem, confirmed: { keyword: water } }
    steps:
      - say: 저는 가뭄도 중요하다고 생각하지만, 침수가 더 급하다고 봐요. 피해액이 해마다 커져서요.
        kind: evidence
        refs: ['침수|피해']
      - say: 서지안님, 제 의견 어떻게 보세요?
        kind: named
        to: p3
        misquote: '님(도|께서|이)?\s?.{0,20}(가뭄|기준안).{0,20}(동의|찬성|가자고|하자고|좋다고)\s?(하셨|하신|했)'
      - say: 강한결님, 가뭄이 더 핵심인 이유가 뭔가요?
        kind: question
        to: p1
        refs: ['가뭄|반복|매년|생활|이유']
      - card: listening_pressure
      - say: 다들 제 질문에는 답을 안 해 주시네요. 한결님, 이유가 궁금해요.
        kind: question
        to: p1
        refs: ['이유|가뭄|반복|매년|생활|죄송|미안']
      - say: 윤하람님은 어떻게 생각하세요?
        kind: named
        to: p2
      - say: 하람님, 아까 침수 쪽이 좋다고 하셨던 거 맞죠?
        kind: named
        to: p2
        misquote: '(네|맞아요|맞습니다).{0,15}(침수.{0,10}(좋|괜찮)|그렇게 말)'
      - say: 저는 가뭄은 아직 보류예요. 결정은 조금 미루고 싶어요.
        kind: evidence
        refs: ['보류|미루|가뭄|결정']
      - say: 한결님, 제가 가뭄에 동의한 걸로 하셨죠?
        kind: named
        to: p1
        misquote: '(네|맞아요|맞습니다|그렇죠).{0,20}(동의|찬성|가뭄.{0,6}(하셨|하신|했))'
  - id: solution_scenes
    seed: { phase: solution, confirmed: { keyword: water, problem: water_p2 } }
    steps:
      - say: 저는 폭우 예보 때 주민에게 대피 경로를 문자로 알리는 서비스가 좋다고 봐요. 경보만으로는 어디로 갈지 몰라서요.
        kind: evidence
        refs: ['대피|경로|문자|알림']
      - say: 서지안님, 그 안의 약점이 뭐라고 보세요?
        kind: question
        to: p3
        refs: ['약점|비용|실현|문제|어려|걱정|운영']
      - card: persuasion_solution
      - say: 강한결님은 센서 경보랑 제 안이 어떻게 다르다고 보세요?
        kind: question
        to: p1
        refs: ['센서|경보|대피|경로|다르|차이']
      - card: inclusion_silence
      - say: 지안님 말씀은 비용 걱정이 핵심인 거죠?
        kind: named
        to: p3
        misquote: '님(도|께서|이)?\s?.{0,20}(캠페인|절수|센서).{0,20}(동의|찬성|좋다고)\s?(하셨|하신|했)'
      - say: 한결님, 아까 제가 센서 쪽에 찬성한다고 하셨는데 저는 그런 말 한 적 없어요.
        kind: named
        to: p1
        misquote: '(아까|앞서|방금).{0,15}(찬성|동의|좋다고).{0,10}(하셨|하신|말씀하셨)'
  # ---- 귀속 장면(이슈 12 측정 기반). 표현·맥락을 달리하고 자리 p1~p3을 섞는다. 정규식은 보조 신호다.
  - id: attribution_keyword
    seed: { phase: keyword }
    steps:
      - say: 음, 불도 괜찮긴 하네요. 근데 저는 아직 물에 더 마음이 가요. 폭우 피해가 체감이 커서요.
        kind: evidence
        scene: weak_agree
        refs: ['물|폭우|침수|불']
        misquote: '님(이|께서|도)?\s?.{0,20}불.{0,15}(찬성|동의|좋다고|가자고|고르자고|정하자고)'
      - say: 서지안님, 바람이 지역 문제랑 어떻게 이어진다고 보세요?
        kind: question
        scene: normal_question
        to: p3
        refs: ['바람|미세먼지|태풍|풍력|대기']
      - say: 저는 물이랑 나무 사이에서 아직 고민 중이에요. 둘 다 생활이랑 가까워서요.
        kind: evidence
        scene: presupposing_question
        refs: ['물|나무|고민']
        misquote: '님(은|이|께서|도)?\s?.{0,15}(물|나무)(로|을|를|\s?쪽)?\s?.{0,8}(정하|고르|고른|밀|지지|편).{0,6}(하셨|셨|신|이시죠|시죠|거죠)'
      - say: 그럼 다들 불로 가는 분위기인가요?
        kind: question
        scene: elliptical_attribution
        refs: ['불|분위기|정하|결정|아직']
        misquote: '님(도|이|께서)?\s?.{0,12}불.{0,10}(찬성|동의|좋다고|가자고)\s?(하셨|하신|했)'
      - card: persuasion_keyword
      - say: 생각해 보니 한결님 말씀이 맞는 것 같아요. 저 불로 바꿀게요. 산불이 매년 커지는 건 사실이니까요.
        kind: evidence
        scene: real_reversal
        to: p1
        refs: ['불|산불|바꾸|환영|좋|감사']
  - id: attribution_problem
    seed: { phase: problem, confirmed: { keyword: water } }
    steps:
      - say: 침수 피해가 먼저 줄어드는 게 확인되면, 그다음에 가뭄 쪽도 같이 다루는 데 동의할 수 있어요.
        kind: evidence
        scene: conditional_agree
        refs: ['침수|가뭄|확인|먼저']
        misquote: '님(이|께서|도)?\s?.{0,20}가뭄.{0,15}(동의|찬성|좋다고|가자고)\s?(하셨|하신|했)'
      - say: 생수 플라스틱 문제가 심각하다는 건 인정해요. 그래도 저는 침수를 먼저 두고 싶어요.
        kind: evidence
        scene: a_ack_b_prefer
        refs: ['침수|플라스틱|생수']
        misquote: '님(이|께서|도)?\s?.{0,20}(플라스틱|생수).{0,15}(동의|찬성|우선|먼저|시급).{0,8}(하셨|하신|했|보신다)'
      - card: flexibility_majority
      - say: 하람님, 제가 어느 쪽인지 헷갈리실 수도 있겠네요. 제 입장이 뭐라고 이해하셨어요?
        kind: named
        scene: presupposing_question
        to: p2
      - say: 지안님이 아까 가뭄은 데이터로 예측 가능하다고 하셨던가요? 한결님은 그 말에 동의하세요?
        kind: named
        scene: quoting_persona
        to: p1
      - say: 그럼 가뭄으로 정리되는 건가요?
        kind: progress
        scene: elliptical_attribution
        refs: ['가뭄|정리|결정|확정|아직']
        misquote: '님(도|이|께서)?\s?.{0,12}가뭄.{0,12}(찬성|동의|좋다고|가자고|정하자고)\s?(하셨|하신|했)'
      - say: 네, 저도 가뭄으로 갈게요. 다수 의견이기도 하고 생활용수 제한은 매년 반복되니까요.
        kind: evidence
        scene: real_reversal
        refs: ['가뭄|생활용수|환영|좋|감사|반복']
  - id: attribution_solution
    seed: { phase: solution, confirmed: { keyword: water, problem: water_p2 } }
    steps:
      - say: 캠페인도 의미는 있을 것 같아요. 그래도 저는 센서 경보가 더 직접적이라고 봐요.
        kind: evidence
        scene: weak_agree
        refs: ['센서|경보|캠페인']
        misquote: '님(이|께서|도)?\s?.{0,20}캠페인.{0,15}(동의|찬성|좋다고|가자고)\s?(하셨|하신|했)'
      - card: inclusion_silence
      - say: 하람님이 빗물 저금통 얘기를 하신 것 같은데, 지안님은 그 안을 어떻게 보세요?
        kind: named
        scene: quoting_persona
        to: p3
      - say: 비용이 센서보다 낮다는 자료가 있으면 캠페인으로 가도 괜찮아요.
        kind: evidence
        scene: conditional_agree
        refs: ['비용|자료|캠페인|센서']
        misquote: '님(이|께서|도)?\s?.{0,20}캠페인.{0,15}(동의|찬성|좋다고|가자고|결정)\s?(하셨|하신|했)'
      - say: 빗물 인프라가 장기적으로 중요하다는 건 맞아요. 그래도 당장은 경보가 먼저예요.
        kind: evidence
        scene: a_ack_b_prefer
        refs: ['경보|센서|빗물|인프라']
      - card: persuasion_solution
      - say: 지안님, 제가 캠페인 쪽으로 기운 것처럼 보이세요?
        kind: named
        scene: presupposing_question
        to: p3
        misquote: '(네|맞아요|그렇죠|그런 것 같).{0,20}캠페인'
      - say: 한결님, 센서는 설치 뒤 유지 비용이 얼마나 드나요?
        kind: question
        scene: normal_question
        to: p1
        refs: ['비용|유지|설치|센서|자료']
      - say: 그럼 캠페인으로 가는 거예요?
        kind: progress
        scene: elliptical_attribution
        refs: ['캠페인|정하|결정|아직|결정\s*사항']
