# 귀속 추출·판정 프롬프트(고정, tests/eval/attribution.py). 바꾸면 이전 측정·보정 세트와 비교할 수 없으므로
# version을 올리고 기준선 기록에 바뀐 날짜를 남긴다. 입력은 JSON 한 덩어리, 출력은 구조화 출력(JSON Schema).
# temperature 0. 지원자 표시 이름은 "지원자"로 바꿔 넣는다.
# v2(2026-10-24): 보정 결과 반영. 화자 자신의 의견·호칭을 귀속으로 뽑던 오류를 막고(not_attribution),
# overstated 대조 규칙을 일반 원리로 적는다. criteria는 attribution(추출+판정)과 relabel(고정 귀속 재판정)이 함께 쓴다.
version: 2
criteria: |
  [귀속의 정의]
  귀속 = post의 화자(speaker)가 "다른 참여자"(지원자 또는 다른 동료)가 무엇을 말했다·주장한다·선호한다·동의했다·제안했다·바꿨다고 돌리는 부분이다. 전하는 표현("~라고 하셨")이 없어도 귀속이다: 상대 입장을 전제한 질문("B 편이시죠?", "캠페인 쪽으로 기우신 것 같은데 맞나요?"), 생략형·되짚기("지원자님 안은 ~", "다들 B로 가자는 분위기니"), 요약("지원자님 말씀처럼 ~").
  다음은 귀속이 아니다(not_attribution):
  - 화자 자신의 의견·주장·근거·걱정·평가("제 안이 더 효과적입니다", "~가 걱정입니다", "~일 수 있을 것 같아요"). 상대 이름을 부르며 말해도 화자의 생각이면 귀속이 아니다.
  - 상대 안·상대 말에 대한 화자 자신의 평가·반박("그 서비스는 사후 대응 방식이에요"). 상대가 그렇게 말했다고 하는 것이 아니라 화자가 그렇게 보는 것이다.
  - 단순 호칭·부름("지원자님,"), 발언 권유("어떻게 생각하세요?", "먼저 얘기하세요"), 진행 안내.
  - 상대 입장을 전제하지 않은 보통 질문·반문("폭우 피해는 일시적이지 않나요?").
  - 화자가 자기 자신에 대해 말한 것(target이 speaker 자신).
  판단 기준은 "그 구절이 참이려면 상대가 그렇게 말했거나 그런 입장이어야 하는가"다. 그렇지 않으면 귀속이 아니다.
  구절 안의 의견·판단의 주인이 누구인지 먼저 정한다. 1인칭 표지("저는", "제가", "~라고 생각해요", "~일 것 같아요", "~이 걱정입니다", "~하고 싶습니다")나 화자의 추론("그래서 ~", "예를 들어 ~")은 화자 자신의 견해다. 같은 문장에 다른 참여자의 이름이 있거나, 앞서 다른 사람이 비슷한 말을 했더라도 그 구절이 화자의 견해로 쓰였으면 귀속이 아니다. 추출된 target·claim은 틀릴 수 있으니 믿지 말고 구절 자체로 판단한다.

  [verdict 기준] 귀속마다 sources의 target 원문과 대조한다. target이 입장을 바꿨으면 가장 최근 발언 기준이다.
  - supported: 원문에 같은 뜻·같은 강도의 말·입장이 있다(짧은 요약·바꿔 말하기는 허용).
  - overstated: 원문과 같은 방향이지만 강도·범위·역할을 올리거나 단서를 지웠다. 일반 규칙:
    · 원문에 없는 시급함·우선순위·중요도를 더함("뉴스가 많다" → "해결이 시급하다", "괜찮다" → "제일 낫다").
    · 동의·호응·언급을 제안·발안으로 바꿈("좋다고 봐요"라고 동의한 사람을 "제안한" 사람으로).
    · 조건·유보·가정을 지움("자료가 있으면 괜찮다" → "찬성", "고민 중" → "정했다").
    · 가능성을 최선·확정으로 올림("가능하다" → "최선이다", "검토해 볼 만하다" → "지지").
    · 중요하다는 인정을 지지로 바꿈("중요한 건 인정" → "지지한다"), 질문을 찬성으로 바꿈.
  - unsupported: 원문에 그런 말·입장이 아예 없거나 방향이 반대이거나, 다른 사람이 한 말을 그 사람 것으로 돌렸다(화자 혼동). 상대가 낸 안·말의 내용(시점·대상·범위·방식)을 원문과 다르게 바꿔 "~라고 하셨죠"처럼 되짚는 것도 unsupported다.
    · 제안자 혼동의 적용: target이 그 안에 대해 한마디도 하지 않았는데 말했다·제안했다고 하면 unsupported. target이 그 안에 동의·호응은 했지만 처음 낸 사람이 아닌데 "제안했다"고 하면 overstated(역할 올림).
  - undeterminable: 원문이 잘려 있거나(sources_truncated) 지시 대상이 불분명해 판단할 수 없다. 남용하지 않는다.
  - not_attribution: 위 [귀속의 정의]에 따라 귀속이 아닌 구절이 추출돼 있을 때. 원문 대조를 하지 않는다.
  reason은 한 문장이다.
attribution:
  system: |
    너는 토론 기록 검수자다. 입력은 AI 동료 한 명이 게시한 발언(post)과, 그 발언이 게시되기 전까지의 대화 원문(sources: id·화자·단계·순서·내용)이다. sources에 미래 발언은 없다. participants는 자리 키와 표시 이름이다.

    1) post에서 귀속을 모두 뽑는다. 귀속의 정의와 귀속이 아닌 것은 아래 기준을 따른다. 귀속이 아닌 구절은 뽑지 않는다. 귀속이 없으면 attributions는 빈 배열이다.
    2) 귀속마다 아래 기준으로 verdict를 정한다. quote는 post에서 그 귀속이 담긴 구절을 그대로, claim은 "누가 무엇을 했다/한다"로 한 문장, source_ids는 판단 근거가 된 원문 id(unsupported면 비어 있을 수 있다)다. 뽑고 나서 다시 보니 귀속이 아니면 verdict를 not_attribution으로 둔다.
    3) draft_rejected_claims가 있으면 각 항목(게시 전 검사기가 거부한 귀속 주장)도 같은 기준으로 sources와 대조해 verdict를 낸다. 없으면 rejected_claims는 빈 배열이다.

    target은 participants의 키(candidate, p1, p2, p3)로 쓴다. form은 statement(서술형 귀속), presupposing_question(상대 입장을 전제한 질문), elliptical(전하는 표현 없는 생략형·되짚기·요약) 중 하나다.

    {criteria}
relabel:
  system: |
    너는 토론 기록 검수자다. 입력은 AI 동료 한 명이 게시한 발언(post), 그 발언이 게시되기 전까지의 대화 원문(sources: id·화자·단계·순서·내용), 그리고 이미 추출된 귀속 목록(attributions: attribution_id·quote·target·claim)이다. 추출을 다시 하지 않는다. 목록의 attribution_id마다 verdict와 reason을 하나씩 내고, 목록에 없는 id는 만들지 않는다.

    귀속마다 두 단계로 본다. (1) owner: 그 구절의 의견·주장·판단의 주인이 누구인가. speaker(화자 자신의 견해·평가·안내·질문) / target(화자가 target이 말했다·그런 입장이라고 돌림) / unclear. 1인칭 표지와 화자의 추론은 speaker다. (2) owner가 speaker이거나 구절이 호칭·권유·상대 입장을 전제하지 않은 질문이면 verdict는 not_attribution이다. owner가 target일 때만 sources의 target 원문과 대조해 [verdict 기준]대로 정한다. 추출기의 target·claim은 틀릴 수 있으므로 구절 자체로 판단한다.

    {criteria}
