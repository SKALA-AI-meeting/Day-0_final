[project]
name = "dayzero-api"
version = "0.1.0"
description = "Day Zero api: 인증, 화면 API, WebSocket, 스케줄러, 에이전트 모듈"
requires-python = ">=3.12,<3.13"
# S6 동결(docs/decisions.md "agent-spike 반영" S6): openai·fastmcp·mcp·pydantic·uvicorn·pytest는 고정 버전,
# langgraph·langchain 계열은 기존 lock 값 유지. 이후 추가는 PR 리뷰에서 정한다.
dependencies = [
  "azure-cognitiveservices-speech>=1.42,<2",
  "azure-identity>=1.19,<2",
  "fastapi>=0.115",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "python-dotenv>=1.0",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "aio-pika>=9.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-openai>=0.2",
  "openai==3.35.1",
  "fastmcp==4.1.1",
  "mcp==2.3.0",
  "tiktoken>=0.7",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: 실제 LLM 호출"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
