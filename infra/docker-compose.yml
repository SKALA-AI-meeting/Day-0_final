# Day Zero 전체 구성(8개 서비스, docs/architecture/deployment.md "Docker Compose").
# 공개 포트는 web(3000), api(8000), rabbitmq 관리 UI(127.0.0.1 전용)뿐이다. MCP 3개와 api 내부 8001은 compose 네트워크 안.
# 공개 포트 번호는 env(WEB_PORT·API_PORT·RABBITMQ_UI_PORT)로 바꿀 수 있다(같은 기계에서 스택 두 개를 띄울 때).
# 서비스 간 주소(DB·큐·내부 API·MCP)는 아래 environment가 정하므로 env 파일의 같은 키보다 우선한다.
# env 파일에 호스트용 주소(localhost)가 있거나 그 키가 없어도(infra/.env 없이 dev-fake·test-text를 띄울 때)
# 컨테이너는 항상 compose 서비스 이름으로 닿는다.
# 컨테이너 env 파일은 DAYZERO_ENV_FILE(없으면 .env). make up PROFILE=…이 프로필과 .env를 합친
# .env.resolved-<프로필>을 만들어 --env-file과 여기 둘 다에 준다(scripts/profile.py render).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dayzero
      POSTGRES_PASSWORD: dayzero
      POSTGRES_DB: dayzero
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayzero"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"   # 관리 UI, 로컬에서만
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../services/api
    env_file: ${DAYZERO_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://dayzero:dayzero@postgres:5432/dayzero
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DEBATE_MCP_URL: http://debate-mcp:9101/mcp
      RAG_MCP_URL: http://rag-mcp:9102/mcp
      ASSESSMENT_MCP_URL: http://assessment-mcp:9103/mcp
    ports:
      - "${API_PORT:-8000}:8000"   # 공개 API. 내부 API 8001은 공개하지 않는다
    expose: ["8001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      debate-mcp: { condition: service_healthy }
      rag-mcp: { condition: service_healthy }
      assessment-mcp: { condition: service_healthy }
    volumes:
      - ../scenarios:/scenarios:ro
      - hfcache:/models   # 로컬 받아 적기(whisper)·읽기(supertonic) 모델. rag-mcp와 같은 캐시 볼륨

  debate-mcp:
    build: ../services/debate-mcp
    env_file: ${DAYZERO_ENV_FILE:-.env}
    environment:
      API_INTERNAL_URL: http://api:8001
    expose: ["9101"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9101/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  rag-mcp:
    build: ../services/rag-mcp
    env_file: ${DAYZERO_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://dayzero:dayzero@postgres:5432/dayzero
      API_INTERNAL_URL: http://api:8001
    expose: ["9102"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9102/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60   # 모델 로드 시간
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../scenarios:/scenarios:ro
      - hfcache:/models
    deploy:
      resources:
        limits:
          memory: 3g

  assessment-mcp:
    build: ../services/assessment-mcp
    env_file: ${DAYZERO_ENV_FILE:-.env}
    environment:
      API_INTERNAL_URL: http://api:8001
    expose: ["9103"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9103/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  report-worker:
    build: ../services/report-worker
    env_file: ${DAYZERO_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://dayzero:dayzero@postgres:5432/dayzero
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      API_INTERNAL_URL: http://api:8001
      ASSESSMENT_MCP_URL: http://assessment-mcp:9103/mcp
    healthcheck:   # 워커가 30초마다 갱신하는 heartbeat 파일
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 90"]
      interval: 15s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      api: { condition: service_healthy }
      assessment-mcp: { condition: service_healthy }

  seed:   # 일회성 시드(make seed-compose). 기본 up에는 뜨지 않고 compose 네트워크 안에서 postgres·api·rag-mcp에 닿는다
    build: ../services/api
    profiles: ["tools"]
    environment:
      SEED_DATABASE_URL: postgresql://dayzero:dayzero@postgres:5432/dayzero
    entrypoint: ["python", "/repo/scripts/seed.py", "--api", "http://api:8000", "--rag", "http://rag-mcp:9102/mcp"]
    volumes:
      - ../scripts:/repo/scripts:ro
      - ../scenarios:/repo/scenarios:ro
    depends_on:
      api: { condition: service_healthy }
      rag-mcp: { condition: service_healthy }

  web:
    build:
      context: ../apps/web
      args:   # 빌드 시점 값. 프로필(--env-file)이 정하고 바꾸면 다시 빌드한다
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_VOICE_ENABLED: ${VOICE_ENABLED:-1}
        NEXT_PUBLIC_VOICE_PROVIDER: ${VOICE_PROVIDER:-azure}
        NEXT_PUBLIC_VOICE_STT_PROVIDER: ${VOICE_STT_PROVIDER:-}
        NEXT_PUBLIC_VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-}
    env_file: ${DAYZERO_ENV_FILE:-.env}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  rabbitdata:
  hfcache:
