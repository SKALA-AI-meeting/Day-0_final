# 격리 스택 override(test-text·test-voice·eval-text·eval-voice 프로필): 별도 compose 프로젝트 dayzero-debate로 띄운다.
#   make up PROFILE=test-text   (= DAYZERO_ENV_FILE=.env.resolved-test-text docker compose -p dayzero-debate
#                                  --env-file infra/.env.resolved-test-text -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml up -d --build --wait)
# 호스트 포트는 다른 스택과 겹치지 않게 api 8100·내부 8101·web 3100·rabbitmq UI 15674(127.0.0.1)로 옮기고,
# 시드·테스트 API용으로 postgres 5442·rag-mcp 9112를 127.0.0.1에만 연다. env는 base의 DAYZERO_ENV_FILE
# (프로필이 합친 파일)을 그대로 쓰며 모드 값(LLM_FAKE·ENABLE_TEST_API)은 프로필이 정한다.
# 모델 캐시 볼륨은 이미 받아 둔 infra_hfcache를 재사용한다(없으면 external을 지우면 새로 받는다).
services:
  postgres:
    ports: ["127.0.0.1:5442:5432"]
  api:
    ports: !override
      - "${API_PORT:-8100}:8000"
      - "127.0.0.1:8101:8001"   # 내부 API(테스트 API 포함). 로컬 전용
  rag-mcp:
    ports: ["127.0.0.1:9112:9102"]
volumes:
  hfcache:
    external: true
    name: infra_hfcache
