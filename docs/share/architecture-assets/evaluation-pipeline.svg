<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="평가 파이프라인 · 사실에서 사람의 최종 검토까지">
<ns0:style>text{font-family:Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;fill:#1D1D1F}.title{font-size:20px;font-weight:700}.head{font-size:15px;font-weight:700}.body{font-size:12.5px}.small{font-size:11px;fill:#4A5263}.line{stroke:#4A5263;stroke-width:1.8;fill:none}.dash{stroke:#B25000;stroke-width:1.5;stroke-dasharray:5 4;fill:none}</ns0:style>
<ns0:defs><ns0:marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:path d="M0 0 L8 4 L0 8 Z" fill="#4A5263" /></ns0:marker></ns0:defs>
<ns0:text x="24" y="32" class="title">평가 파이프라인 · 사실에서 사람의 최종 검토까지</ns0:text>
<ns0:rect x="120" y="58" width="860" height="70" rx="10" fill="#FDF1DD" stroke="#B26A00" stroke-width="1.5" />
<ns0:text x="134" y="83" class="head">report.generate 수신</ns0:text>
<ns0:text x="134" y="103" class="body">세션 종료 · 재시도/DLQ</ns0:text>
<ns0:path d="M550 128 L550 146" class="line" marker-end="url(#arrow)" />
<ns0:rect x="120" y="146" width="860" height="70" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<ns0:text x="134" y="171" class="head">collect</ns0:text>
<ns0:text x="134" y="191" class="body">세션 기록 · 척도 · 기여 · 채용 건 복사본 수집</ns0:text>
<ns0:path d="M550 216 L550 234" class="line" marker-end="url(#arrow)" />
<ns0:rect x="120" y="234" width="860" height="70" rx="10" fill="#EEF0F3" stroke="#5F6873" stroke-width="1.5" />
<ns0:text x="134" y="259" class="head">aggregate</ns0:text>
<ns0:text x="134" y="279" class="body">장면 사실 계산 · 결정 시각 · preempted · AI 사용 집계</ns0:text>
<ns0:path d="M550 304 L550 322" class="line" marker-end="url(#arrow)" />
<ns0:rect x="120" y="322" width="860" height="70" rx="10" fill="#EEE9FB" stroke="#5B3FB3" stroke-width="1.5" />
<ns0:text x="134" y="347" class="head">evaluate · 요소별 판단과 검증</ns0:text>
<ns0:text x="134" y="367" class="body">근거·사실 검증 → 요소 재요청 → 코드로 요약 조립</ns0:text>
<ns0:path d="M550 392 L550 410" class="line" marker-end="url(#arrow)" />
<ns0:rect x="120" y="410" width="860" height="70" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<ns0:text x="134" y="435" class="head">draft</ns0:text>
<ns0:text x="134" y="455" class="body">검증된 평가와 대화 맥락으로 초안 구성 · 소비자가 /report/draft 저장</ns0:text>
<ns0:path d="M550 480 L550 498" class="line" marker-end="url(#arrow)" />
<ns0:rect x="120" y="498" width="860" height="70" rx="10" fill="#EEF0F3" stroke="#5F6873" stroke-width="1.5" />
<ns0:text x="134" y="523" class="head">approval (interrupt) → finalize</ns0:text>
<ns0:text x="134" y="543" class="body">담당자 검토 완료 뒤 report.approve로 재개 · 최종 저장</ns0:text>
<ns0:text x="550" y="602" text-anchor="middle" class="small">기록 없음: 장면 없음 · 반응 없음 · 판단 보류 / 근거 없는 수준은 저장 금지</ns0:text>
</ns0:svg>