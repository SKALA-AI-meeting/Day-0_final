<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-label="에이전트 구성 · 결정적 그래프와 역할">
<style>text{font-family:Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;fill:#1D1D1F}.title{font-size:20px;font-weight:700}.head{font-size:15px;font-weight:700}.body{font-size:12.5px}.small{font-size:11px;fill:#4A5263}.line{stroke:#4A5263;stroke-width:1.8;fill:none}.dash{stroke:#B25000;stroke-width:1.5;stroke-dasharray:5 4;fill:none}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4A5263" /></marker></defs>
<text x="24" y="32" class="title">에이전트 구성 · 결정적 그래프와 역할</text>
<rect x="28" y="60" width="250" height="95" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="42" y="85" class="head">의도 분류 · MODEL_INTENT</text>
<text x="42" y="105" class="body">message 자극을 꺼낼 때 실행</text>
<text x="42" y="123" class="body">withhold · reservation · excluded</text>
<rect x="325" y="60" width="335" height="95" rx="10" fill="#EEE9FB" stroke="#5B3FB3" stroke-width="1.5" />
<text x="339" y="85" class="head">진행 매니저 · MODEL_TURN</text>
<text x="339" y="105" class="body">합의·카드·지명·질문 규칙</text>
<text x="339" y="123" class="body">빈 자리: 이끎 → LLM → 기본 응답</text>
<rect x="710" y="60" width="360" height="95" rx="10" fill="#EEE9FB" stroke="#5B3FB3" stroke-width="1.5" />
<text x="724" y="85" class="head">동료 · MODEL_PERSONA</text>
<text x="724" y="105" class="body">고집형 · 소극형 · 비판형</text>
<text x="724" y="123" class="body">[상황] [내 입장] [카드 차례]</text>
<path d="M278 108 L325 108" class="line" marker-end="url(#arrow)" />
<path d="M660 108 L710 108" class="line" marker-end="url(#arrow)" />
<rect x="28" y="210" width="1040" height="105" rx="10" fill="#EEE9FB" stroke="#5B3FB3" stroke-width="1.5" />
<text x="42" y="235" class="head">토론 그래프 · 체크포인터 없음</text>
<text x="42" y="255" class="body">load → cards → turn → respond → guard → stance_check → wait_typing → apply</text>
<text x="42" y="273" class="body">apply → 다음 화자 respond 반복 / 화자 0명이면 바로 fill → END</text>
<path d="M512 155 L512 210" class="line" marker-end="url(#arrow)" />
<rect x="28" y="360" width="315" height="112" rx="10" fill="#E8F0FD" stroke="#2459B8" stroke-width="1.5" />
<text x="42" y="385" class="head">debate / rag MCP</text>
<text x="42" y="405" class="body">토론 상태·기록·자료</text>
<text x="42" y="423" class="body">동료 허용 조회 도구 · 평가 접근 없음</text>
<rect x="390" y="360" width="315" height="112" rx="10" fill="#EEE9FB" stroke="#5B3FB3" stroke-width="1.5" />
<text x="404" y="385" class="head">AI 어시스턴트</text>
<text x="404" y="405" class="body">api assistant runner · 별도 도구 호출 루프</text>
<text x="404" y="423" class="body">모든 단계 · 오른쪽 아래 탭에서 열림</text>
<rect x="752" y="360" width="316" height="112" rx="10" fill="#FDF1DD" stroke="#B26A00" stroke-width="1.5" />
<text x="766" y="385" class="head">평가 에이전트 · 워커</text>
<text x="766" y="405" class="body">세션 종료 뒤 요소별 판단</text>
<text x="766" y="423" class="body">요소 요약은 워커 코드가 조립</text>
<text x="550" y="507" text-anchor="middle" class="small">게시된 동료 발언 → TTS → 순차 재생 → ended 확인 → USER_READY</text>
<text x="550" y="302" text-anchor="middle" class="small">fill은 이전부터 성립한 합의만 처리 · 이번 발언의 합의는 다음 run</text></svg>