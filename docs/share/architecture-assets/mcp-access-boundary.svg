<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="565" viewBox="0 0 1100 565" role="img" aria-label="MCP 접근 경계 · 역할별 허용 도구와 토큰">
<style>text{font-family:Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;fill:#1D1D1F}.title{font-size:20px;font-weight:700}.head{font-size:15px;font-weight:700}.body{font-size:12.5px}.small{font-size:11px;fill:#4A5263}.line{stroke:#4A5263;stroke-width:1.8;fill:none}.dash{stroke:#B25000;stroke-width:1.5;stroke-dasharray:5 4;fill:none}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4A5263" /></marker></defs>
<text x="24" y="32" class="title">MCP 접근 경계 · 역할별 허용 도구와 토큰</text>
<rect x="35" y="62" width="300" height="112" rx="10" fill="#EEE9FB" stroke="#5B3FB3" stroke-width="1.5" />
<text x="49" y="87" class="head">동료 3명</text>
<text x="49" y="107" class="body">debate: transcript · proposal draft</text>
<text x="49" y="125" class="body">rag: search · material</text>
<rect x="400" y="62" width="300" height="112" rx="10" fill="#EEE9FB" stroke="#5B3FB3" stroke-width="1.5" />
<text x="414" y="87" class="head">진행 매니저 결정적 노드</text>
<text x="414" y="107" class="body">debate: 상태·메시지·칸 변경</text>
<text x="414" y="125" class="body">assessment: 카드 관찰 기록</text>
<rect x="765" y="62" width="300" height="112" rx="10" fill="#FDF1DD" stroke="#B26A00" stroke-width="1.5" />
<text x="779" y="87" class="head">report-worker 평가 에이전트</text>
<text x="779" y="107" class="body">assessment: 기록·척도·결과</text>
<text x="779" y="125" class="body">세션 종료 뒤에만 접근</text>
<rect x="35" y="256" width="300" height="130" rx="10" fill="#E8F0FD" stroke="#2459B8" stroke-width="1.5" />
<text x="49" y="281" class="head">debate-mcp · rag-mcp</text>
<text x="49" y="301" class="body">토론 기록 reply_to 포함</text>
<text x="49" y="319" class="body">자료 버전 고정 · 검색 색인</text>
<rect x="400" y="256" width="300" height="130" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="414" y="281" class="head">api /internal</text>
<text x="414" y="301" class="body">X-Internal-Token · 업무 데이터 저장</text>
<text x="414" y="319" class="body">debate-mcp → 내부 API → 업무 데이터</text>
<rect x="765" y="256" width="300" height="130" rx="10" fill="#E8F0FD" stroke="#2459B8" stroke-width="1.5" />
<text x="779" y="281" class="head">assessment-mcp</text>
<text x="779" y="301" class="body">X-Assessment-Token 별도</text>
<text x="779" y="319" class="body">관찰 · 평가 저장/조회</text>
<path d="M185 174 L185 256" class="line" marker-end="url(#arrow)" />
<text x="201" y="208" text-anchor="middle" class="small">조회</text>
<text x="380" y="216" text-anchor="middle" class="small">debate 도구 전부</text>
<path d="M915 174 L915 256" class="line" marker-end="url(#arrow)" />
<text x="934" y="208" text-anchor="middle" class="small">평가</text>
<path d="M335 320 L400 320" class="line" marker-end="url(#arrow)" />
<path d="M765 320 L700 320" class="line" marker-end="url(#arrow)" />
<rect x="35" y="435" width="1030" height="85" rx="10" fill="#FFFBEF" stroke="#E2CF9E" stroke-width="1.5" />
<text x="49" y="460" class="head">동료의 평가 접근 차단</text>
<text x="49" y="480" class="body">동료의 도구 허용 목록에 assessment-mcp가 없고 토큰도 발급하지 않습니다.</text>
<text x="49" y="498" class="body">음성 경로는 새 MCP를 추가하지 않으며 업무 데이터 쓰기는 api를 거칩니다.</text>
<path d="M470 174 L470 225 L300 225 L300 256" class="line" marker-end="url(#arrow)" /><path d="M635 174 L635 228 L805 228 L805 256" class="line" marker-end="url(#arrow)" /><text x="700" y="219" text-anchor="middle" class="small">record_observation</text></svg>