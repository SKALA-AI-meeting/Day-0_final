<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-label="음성 토론 턴 · 게시, 청취, 발언의 순서">
<style>text{font-family:Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;fill:#1D1D1F}.title{font-size:20px;font-weight:700}.head{font-size:15px;font-weight:700}.body{font-size:12.5px}.small{font-size:11px;fill:#4A5263}.line{stroke:#4A5263;stroke-width:1.8;fill:none}.dash{stroke:#B25000;stroke-width:1.5;stroke-dasharray:5 4;fill:none}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4A5263" /></marker></defs>
<text x="24" y="32" class="title">음성 토론 턴 · 게시, 청취, 발언의 순서</text>
<rect x="140" y="54" width="820" height="73" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="154" y="79" class="head">① 메일박스·토론 그래프</text>
<text x="154" y="99" class="body">message / phase_started / idle / turn_elapsed / card_due</text>
<text x="154" y="117" class="body">의도·화자 결정 · 미게시 카드 fill_held · 같은 run 재판정 없음</text>
<path d="M550 127 L550 145" class="line" marker-end="url(#arrow)" />
<rect x="140" y="145" width="820" height="73" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="154" y="170" class="head">② Voice Turn Controller</text>
<text x="154" y="190" class="body">AI_GENERATING → AI_SPEAKING</text>
<text x="154" y="208" class="body">메일박스 보류: USER_READY 유지 · 녹음 · 전사 · 처리</text>
<path d="M550 218 L550 236" class="line" marker-end="url(#arrow)" />
<rect x="140" y="236" width="820" height="73" rx="10" fill="#FFFFFF" stroke="#8B939C" stroke-width="1.5" />
<text x="154" y="261" class="head">③ Azure F0 TTS / FakeSpeech</text>
<text x="154" y="281" class="body">guard · stance_check(MODEL_INTENT) 뒤 TTS</text>
<text x="154" y="299" class="body">저장된 최종 발언을 순서대로 합성</text>
<path d="M550 309 L550 327" class="line" marker-end="url(#arrow)" />
<rect x="140" y="327" width="820" height="73" rx="10" fill="#E5F4EC" stroke="#1F8A5B" stroke-width="1.5" />
<text x="154" y="352" class="head">④ 브라우저 재생 확인</text>
<text x="154" y="372" class="body">/voice 조회: 보통 750ms · 처리 중 250ms</text>
<text x="154" y="390" class="body">항목마다 start → 실제 ended · 마지막 뒤 USER_READY</text>
<path d="M550 400 L550 418" class="line" marker-end="url(#arrow)" />
<rect x="140" y="418" width="820" height="73" rx="10" fill="#E5F4EC" stroke="#1F8A5B" stroke-width="1.5" />
<text x="154" y="443" class="head">⑤ 지원자 발언</text>
<text x="154" y="463" class="body">손들기 또는 발언하기 → USER_SPEAKING</text>
<text x="154" y="481" class="body">최대 60초 WAV 업로드</text>
<path d="M550 491 L550 509" class="line" marker-end="url(#arrow)" />
<rect x="140" y="509" width="820" height="73" rx="10" fill="#FFFFFF" stroke="#8B939C" stroke-width="1.5" />
<text x="154" y="534" class="head">⑥ STT와 전사 확인</text>
<text x="154" y="554" class="body">TRANSCRIBING → PROCESSING</text>
<text x="154" y="572" class="body">8초 확인·편집 · 최대 500자</text>
<path d="M550 582 L550 600" class="line" marker-end="url(#arrow)" />
<rect x="140" y="600" width="820" height="73" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="154" y="625" class="head">⑦ WS 메시지 저장</text>
<text x="154" y="645" class="body">client_msg_id = utterance_id</text>
<text x="154" y="663" class="body">generation 증가 → 새 message 자극</text>
</svg>