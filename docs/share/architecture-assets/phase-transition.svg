<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="단계 전환 · 세 가지 칸의 확정과 기획안">
<style>text{font-family:Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;fill:#1D1D1F}.title{font-size:20px;font-weight:700}.head{font-size:15px;font-weight:700}.body{font-size:12.5px}.small{font-size:11px;fill:#4A5263}.line{stroke:#4A5263;stroke-width:1.8;fill:none}.dash{stroke:#B25000;stroke-width:1.5;stroke-dasharray:5 4;fill:none}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4A5263" /></marker></defs>
<text x="24" y="32" class="title">단계 전환 · 토론 3단계의 확정과 기획안</text>
<rect x="35" y="68" width="220" height="78" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="49" y="93" class="head">키워드</text>
<text x="49" y="113" class="body">10분</text>
<path d="M255 107 L305 107" class="line" marker-end="url(#arrow)" />
<rect x="305" y="68" width="220" height="78" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="319" y="93" class="head">문제 상황</text>
<text x="319" y="113" class="body">18분</text>
<path d="M525 107 L575 107" class="line" marker-end="url(#arrow)" />
<rect x="575" y="68" width="220" height="78" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="589" y="93" class="head">해결책</text>
<text x="589" y="113" class="body">18분</text>
<path d="M795 107 L845 107" class="line" marker-end="url(#arrow)" />
<rect x="845" y="68" width="220" height="78" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="859" y="93" class="head">기획안</text>
<text x="859" y="113" class="body">14분</text>
<rect x="35" y="220" width="310" height="123" rx="10" fill="#EEE9FB" stroke="#5B3FB3" stroke-width="1.5" />
<text x="49" y="245" class="head">지원자 직접 확정</text>
<text x="49" y="265" class="body">카드 시각 전이면 preempted</text>
<text x="49" y="283" class="body">카드 미게시여도 확정·전환</text>
<rect x="395" y="220" width="310" height="123" rx="10" fill="#EEE9FB" stroke="#5B3FB3" stroke-width="1.5" />
<text x="409" y="245" class="head">AI 합의 확정</text>
<text x="409" y="265" class="body">지원자 포함 3/4 · 최신 명시 동의</text>
<text x="409" y="283" class="body">카드 게시 뒤 · fill_held 가능</text>
<rect x="755" y="220" width="310" height="123" rx="10" fill="#FDECEB" stroke="#C4362F" stroke-width="1.5" />
<text x="769" y="245" class="head">시간 초과 확정</text>
<text x="769" y="265" class="body">candidate_support → most_support</text>
<text x="769" y="283" class="body">→ earliest → default</text>
<rect x="35" y="420" width="1030" height="145" rx="10" fill="#EEF0F3" stroke="#5F6873" stroke-width="1.5" />
<text x="49" y="445" class="head">api가 확정과 전환을 저장</text>
<text x="49" y="465" class="body">AI 합의: fill_slot 한 트랜잭션 / 시간 초과: filled_by=system, slots.timeout_rule과 규칙별 시스템 공지</text>
<text x="49" y="483" class="body">카드 이끎: seed → bridge → execute · 차례 20초 만료: idle/turn_elapsed</text>
<text x="49" y="501" class="body">기획안 단계(음성): 동료 발언권·USER_READY 없음, 어시스턴트만 도움</text>
<path d="M190 343 L190 420" class="line" marker-end="url(#arrow)" />
<path d="M550 343 L550 420" class="line" marker-end="url(#arrow)" />
<path d="M910 343 L910 420" class="line" marker-end="url(#arrow)" />
<path d="M145 146 L145 178" class="line" /><path d="M415 146 L415 178" class="line" /><path d="M685 146 L685 178" class="line" /><path d="M145 178 L910 178" class="line" /><path d="M190 178 L190 220" class="line" marker-end="url(#arrow)" /><path d="M550 178 L550 220" class="line" marker-end="url(#arrow)" /><path d="M910 178 L910 220" class="line" marker-end="url(#arrow)" /><text x="813" y="170" text-anchor="middle" class="small">토론 3단계 모두</text></svg>