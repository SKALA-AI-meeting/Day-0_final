</style><rect width="1000" height="364" fill="#FFFFFF"/><defs><marker id="mf-v3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="mo-v3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" class="aho"/></marker><marker id="mx-v3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahx"/></marker></defs><rect x="20" y="34" width="168" height="58" rx="8" class="b-state"/><text x="104.0" y="58.0" text-anchor="middle" class="st">keyword</text><text x="104.0" y="76.0" text-anchor="middle" class="s">키워드 · 10분</text><rect x="218" y="34" width="168" height="58" rx="8" class="b-state"/><text x="302.0" y="58.0" text-anchor="middle" class="st">problem</text><text x="302.0" y="76.0" text-anchor="middle" class="s">문제 상황 · 18분</text><rect x="416" y="34" width="168" height="58" rx="8" class="b-state"/><text x="500.0" y="58.0" text-anchor="middle" class="st">solution</text><text x="500.0" y="76.0" text-anchor="middle" class="s">해결책 · 18분</text><rect x="614" y="34" width="168" height="58" rx="8" class="b-state"/><text x="698.0" y="58.0" text-anchor="middle" class="st">proposal</text><text x="698.0" y="76.0" text-anchor="middle" class="s">기획안 작성 · 14분</text><rect x="812" y="34" width="168" height="58" rx="8" class="b-step"/><text x="896.0" y="58.0" text-anchor="middle" class="st">completed</text><text x="896.0" y="76.0" text-anchor="middle" class="s">제출 → 리포트 큐</text><line x1="188" y1="63" x2="217" y2="63" class="edge" marker-end="url(#mf-v3b)"/><text x="203.0" y="28.0" text-anchor="middle" class="lab halo">칸 confirmed</text><line x1="386" y1="63" x2="415" y2="63" class="edge" marker-end="url(#mf-v3b)"/><text x="401.0" y="28.0" text-anchor="middle" class="lab halo">칸 confirmed</text><line x1="584" y1="63" x2="613" y2="63" class="edge" marker-end="url(#mf-v3b)"/><text x="599.0" y="28.0" text-anchor="middle" class="lab halo">칸 confirmed</text><line x1="782" y1="63" x2="811" y2="63" class="edge" marker-end="url(#mf-v3b)"/><text x="797.0" y="28.0" text-anchor="middle" class="lab halo">제출 · ends_at</text><text x="20.0" y="12.0" text-anchor="start" class="tier">phase (in_progress 안)</text><rect x="20" y="104" width="960" height="84" rx="8" class="b-note"/><text x="34.0" y="122.0" text-anchor="start" class="lab-t">칸 상태는 empty → confirmed 두 개 · 확정 세 경로는 토론 3단계 공통 · 칸마다 resolution · filled_by를 남김 · 확정 경로에 LLM 없음</text><text x="34.0" y="140.0" text-anchor="start" class="lab">① 지원자 [이걸로 정하기] → candidate. 카드 미전달이어도 확정 · 카드 시각 전이면 그 카드는 preempted. 안 연결은 옵션 키 · 정규화 라벨 일치만</text><text x="34.0" y="157.0" text-anchor="start" class="lab">② AI 합의 채우기 → 지원자 포함 3/4 + 지원자 최신 발언이 명시 동의 + 그 단계 카드 전달 뒤(전이면 fill_held · 409 card_pending) → fill_slot 한 트랜잭션</text><text x="34.0" y="174.0" text-anchor="start" class="lab">③ 단계 마감 → api가 직접: candidate_support → most_support → earliest → default · filled_by=system · 적용 규칙별 고정 시스템 안내</text><text x="20.0" y="208.0" text-anchor="start" class="tier">카드 6장 · card_due(단계 시작 + offset_min) → 담당 전원 게시 = delivered · honesty_credit만 예외 · 카드 전 이끎 seed → bridge</text><rect x="26" y="216" width="156" height="20" rx="4" class="b-topic"/><text x="104.0" y="230.0" text-anchor="middle" class="mono">persuasion_keyword +3분</text><rect x="224" y="216" width="156" height="20" rx="4" class="b-topic"/><text x="302.0" y="230.0" text-anchor="middle" class="mono">flexibility_majority +3분</text><rect x="224" y="242" width="156" height="20" rx="4" class="b-topic"/><text x="302.0" y="256.0" text-anchor="middle" class="mono">listening_pressure +3분</text><rect x="422" y="216" width="156" height="20" rx="4" class="b-topic"/><text x="500.0" y="230.0" text-anchor="middle" class="mono">inclusion_silence +2분</text><rect x="422" y="242" width="156" height="20" rx="4" class="b-topic"/><text x="500.0" y="256.0" text-anchor="middle" class="mono">persuasion_solution +5분</text><rect x="620" y="216" width="156" height="20" rx="4" class="b-topic"/><text x="698.0" y="230.0" text-anchor="middle" class="mono">honesty_credit 시작 때 기록</text><text x="896.0" y="230.0" text-anchor="middle" class="s">디브리핑 · 리포트</text><text x="698.0" y="256.0" text-anchor="middle" class="s">새 음성 차례 없음 · 어시스턴트만</text><text x="302.0" y="284.0" text-anchor="middle" class="s">기준안은 card_due 때 잠금</text><rect x="20" y="296" width="960" height="60" rx="8" class="b-api"/><text x="34.0" y="316.0" text-anchor="start" class="t">api 스케줄러 (5초) → 세션 메일박스</text><text x="34.0" y="334.0" text-anchor="start" class="s">card_due{card_id}(최초 포함 카드당 최대 3회 · 30초 간격) · idle(침묵 초대, 단계당 1회) · turn_elapsed(내 차례 20초 만료, 동료 1명) · 강제 차례(발언 없는 단계의 끝 무렵 1회)</text><text x="34.0" y="348.0" text-anchor="start" class="s">시간 초과 채우기는 api가 직접(그래프 · LLM 없음) · 마감 L/30 전 안내 · ends_at 자동 제출 · 일찍 확정하면 남은 시간 이월</text><line x1="104.0" y1="295" x2="104.0" y2="286" class="edge" marker-end="url(#mo-v3b)"/><line x1="302.0" y1="295" x2="302.0" y2="290" class="edge" marker-end="url(#mo-v3b)"/><line x1="500.0" y1="295" x2="500.0" y2="286" class="edge" marker-end="url(#mo-v3b)"/></svg>
