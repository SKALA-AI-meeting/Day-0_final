ono">get_transcript_span</text><rect x="505" y="152" width="138" height="19" rx="4" class="b-topic2"/><text x="574.0" y="165.0" text-anchor="middle" class="s">앞 5 · 뒤 3 맥락</text><rect x="505" y="176" width="138" height="19" rx="4" class="b-topic2"/><text x="574.0" y="189.0" text-anchor="middle" class="s">근거 검증 · 조립</text><rect x="664" y="128" width="138" height="19" rx="4" class="b-topic2"/><text x="733.0" y="141.0" text-anchor="middle" class="s">① 체크포인트 저장</text><rect x="664" y="152" width="138" height="19" rx="4" class="b-topic2"/><text x="733.0" y="165.0" text-anchor="middle" class="s">② POST report/draft</text><rect x="664" y="176" width="138" height="19" rx="4" class="b-topic2"/><text x="733.0" y="189.0" text-anchor="middle" class="s">③ report_ready → ack</text><rect x="823" y="128" width="138" height="19" rx="4" class="b-topic2"/><text x="892.0" y="141.0" text-anchor="middle" class="s">final = draft 그대로</text><rect x="823" y="152" width="138" height="19" rx="4" class="b-topic2"/><text x="892.0" y="165.0" text-anchor="middle" class="mono">POST report/final</text><rect x="823" y="176" width="138" height="19" rx="4" class="b-topic2"/><text x="892.0" y="189.0" text-anchor="middle" class="s">조정은 조회 시 병합</text><rect x="22" y="212" width="956" height="94" rx="8" class="b-note"/><text x="36.0" y="231.0" text-anchor="start" class="lab-t">워커 검증 (evaluate 안) · api는 형식과 세션 소속만 검증</text><text x="36.0" y="249.0" text-anchor="start" class="lab">근거 없는 수준 금지 · 근거는 같은 세션의 지원자 메시지 · 금지 표현은 거부 · 근거 1개의 수준 4·5는 수준 3 · 확신도 medium으로 깎음 · 확신도 상한도 깎음(clamp)</text><text x="36.0" y="266.0" text-anchor="start" class="lab">형식 오류 · 근거 부재 · 사실 모순 → 요소 단위 1회 재요청(새로 깨진 차원은 첫 출력 통과 행 유지) → 남은 실패 차원은 evaluate_failed. 전송 · 타임아웃은 저장 없이 큐 재시도</text><text x="36.0" y="283.0" text-anchor="start" class="lab">선결정은 preempted, 지원자 안 채택 뒤 장면 없는 차원은 not_applicable로 워커가 고정 · 저장은 evaluations + evaluation_runs(run_id · prompt_versions · model)</text><text x="36.0" y="300.0" text-anchor="start" class="lab">요소 level은 워커가 차원 평균 반올림(.5 올림) · 요소 요약은 차원별 summary_line으로 워커 코드가 조립 · 같은 run_id면 LLM 재호출 없이 재사용</text></svg>
