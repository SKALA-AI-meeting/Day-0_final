</style><rect width="1000" height="560" fill="#FFFFFF"/><defs><marker id="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahx"/></marker></defs><text x="20" y="18" text-anchor="start" class="tier">Voice Turn Controller 상태 · 한 바퀴 = 동료 발언 재생 → 지원자 발언 1회</text><rect x="40" y="44" width="270" height="112" rx="10" class="b-agent"/><text x="54" y="66" text-anchor="start" class="st">AI_GENERATING</text><text x="54" y="88" text-anchor="start" class="t">토론 그래프 실행</text><text x="54" y="108" text-anchor="start" class="s">화자 0~2명 · guard · stance_check</text><text x="54" y="124" text-anchor="start" class="s">게시 직전 generation 확인</text><rect x="365" y="44" width="270" height="112" rx="10" class="b-ext"/><text x="379" y="66" text-anchor="start" class="st">AI_SPEAKING</text><text x="379" y="88" text-anchor="start" class="t">TTS 순차 재생</text><text x="379" y="108" text-anchor="start" class="s">저장된 최종 발언만 합성</text><text x="379" y="124" text-anchor="start" class="s">항목마다 start → 실제 ended</text><rect x="690" y="44" width="270" height="112" rx="10" class="b-web"/><text x="704" y="66" text-anchor="start" class="st">USER_READY</text><text x="704" y="88" text-anchor="start" class="t">내 차례 · 20초 유지</text><text x="704" y="108" text-anchor="start" class="s">일반 · 손들기 · 강제 차례</text><text x="704" y="124" text-anchor="start" class="s">지원자가 [발언하기]로 시작</text><rect x="40" y="230" width="270" height="112" rx="10" class="b-api"/><text x="54" y="252" text-anchor="start" class="st">PROCESSING</text><text x="54" y="274" text-anchor="start" class="t">그대로 제출 · 저장</text><text x="54" y="294" text-anchor="start" class="s">WS message.send · 다른 글이면</text><text x="54" y="310" text-anchor="start" class="s">voice_payload_mismatch 거부</text><rect x="365" y="230" width="270" height="112" rx="10" class="b-ext"/><text x="379" y="252" text-anchor="start" class="st">TRANSCRIBING</text><text x="379" y="274" text-anchor="start" class="t">받아 적기 (STT)</text><text x="379" y="294" text-anchor="start" class="s">지원자에게 글을 보이지 않음</text><text x="379" y="310" text-anchor="start" class="s">빈 인식 · 500자 초과 → 다시 말하기</text><rect x="690" y="230" width="270" height="112" rx="10" class="b-web"/><text x="704" y="252" text-anchor="start" class="st">USER_SPEAKING</text><text x="704" y="274" text-anchor="start" class="t">녹음 · 최대 60초</text><text x="704" y="294" text-anchor="start" class="s">남은 시간 · 음량 · [발언 완료]</text><text x="704" y="310" text-anchor="start" class="s">단계 마감에서 잘림</text><path d="M310,100 L365,100" class="edge" marker-end="url(#mf)"/><path d="M635,100 L690,100" class="edge" marker-end="url(#mf)"/><path d="M825,156 L825,230" class="edge" marker-end="url(#mf)"/><text x="838" y="198" text-anchor="start" class="lab halo">[발언하기] → 서버 발언권 허가</text><path d="M690,286 L635,286" class="edge" marker-end="url(#mf)"/><path d="M365,286 L310,286" class="edge" marker-end="url(#mf)"/><path d="M175,230 L175,156" class="edge" marker-end="url(#mf)"/><text x="188" y="192" text-anchor="start" class="lab halo">generation +1 → message 자극</text><path d="M960,100 L980,100 L980,34 L175,34 L175,44" class="edge-d" marker-end="url(#mf)"/><text x="640" y="38" text-anchor="middle" class="lab-g halo">20초 안에 시작하지 않으면 스케줄러가 동료 차례로 넘김 (turn_elapsed)</text><rect x="40" y="372" width="920" height="176" rx="10" class="b-note"/><text x="56" y="398" text-anchor="start" class="lab-t">녹음 · 전사 중 AI는 기다린다</text><text x="206" y="398" text-anchor="start" class="lab">그 사이 들어온 자극은 메일박스에 queued로 남고, 동료 차례에는 마이크를 열지 않는다. 끼어들기(barge-in)는 없다.</text><text x="56" y="423" text-anchor="start" class="lab-t">손들기</text><text x="206" y="423" text-anchor="start" class="lab">동료 발언 재생 중 [손들기] → 재생이 끝나면 내 차례. 시작은 일반 차례처럼 지원자가 [발언하기]로 한다.</text><text x="56" y="448" text-anchor="start" class="lab-t">강제 차례</text><text x="206" y="448" text-anchor="start" class="lab">그 단계에 지원자 발언이 없으면 남은 시간이 min(대기 30 + 발언 60 + 10초, 단계 길이의 절반) 이하일 때 단계당 한 번.</text><text x="56" y="473" text-anchor="start" class="lab-t">다시 말하기</text><text x="206" y="473" text-anchor="start" class="lab">빈 인식 · 500자 초과는 제출하지 않음. 500자 초과의 다시 말하기는 다시 녹음 1회와 따로 세어 차례당 2회.</text><text x="56" y="498" text-anchor="start" class="lab-t">말한 그대로가 근거</text><text x="206" y="498" text-anchor="start" class="lab">받아 적은 글은 지원자가 보거나 고치지 않고 그대로 제출 · 서버도 같은 글인지 검증(앞뒤 공백만 허용).</text><text x="56" y="523" text-anchor="start" class="lab-t">기획안 단계</text><text x="206" y="523" text-anchor="start" class="lab">새 음성 차례 없음. 이전 단계의 대기 중 음성은 재생을 마치고, 지원자는 어시스턴트만 쓰며 혼자 작성.</text></svg>
